[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
markers = [
    "integration: touches real external infrastructure (opt-in, skipped by default)",
]

[tool.coverage.run]
source = ["app"]
