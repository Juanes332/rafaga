          oneOf:
          - type: number
            minimum: 0
            maximum: 1
            description: Rose frequency covered by completed directions
          - type: 'null'
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        created_at:
          type: string
          format: date-time
      required:
      - id
      - alternative_id
      - kind
      - status
      - progress
      - jobs
      description: 'Polling contract (ADR-07): while any job is queued or running the SPA re-fetches GET /api/v1/simulations/{study_id}
        every 1 s; progress/phase/eta change at least every 2 s (NFR-06). No SSE/WebSocket.'
    StudySummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        alternative_name:
          type: string
        kind:
          type: string
        directions_deg:
          type: array
          items:
            type: number
        status:
          type: string
        progress:
          type: number
        device:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - kind
      - status
      - progress
    Result:
      type: object
      properties:
        id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        study_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - plan2d
          - section2d
          - volume3d
        direction_deg:
          type: number
        device:
          type: string
          enum:
          - cpu
          - gpu
        dx_m:
          type: number
        output_grid:
          $ref: '#/components/schemas/OutputGrid'
        stats:
          type: object
          properties:
            k_mean:
              type: number
            k_max:
              type: number
            k_p95:
              type: number
          required:
          - k_mean
          - k_max
          - k_p95
        convergence:
          type: object
          properties:
            converged:
              type: boolean
            flow_throughs:
              type: number
            rel_change:
              type: number
        fields:
          type: array
          items:
            type: string
            enum:
            - K
            - ux
            - uy
            - uz
            - us
            - speed
            - mask
            - ti
        images:
          type: array
          items:
            type: string
        comparability_key:
          type: string
        warnings:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - kind
      - direction_deg
      - device
      - dx_m
      - output_grid
      - stats
      - fields
      - images
      - comparability_key
    ZoneArea:
      type: object
      properties:
        zone:
          type: string
          enum:
          - acceleration
          - stagnation
          - reduction
        area_m2:
          type: number
        percent:
          type: number
      required:
      - zone
      - area_m2
      - percent
    ZoneAreas:
      type: object
      properties:
        result_id:
          type: string
          format: uuid
        thresholds:
          type: object
          properties:
            k_accel:
              type: number
            k_stagnation:
              type: number
        fluid_area_m2:
          type: number
        zones:
          type: array
          items:
            $ref: '#/components/schemas/ZoneArea'
      required:
      - result_id
      - thresholds
      - fluid_area_m2
      - zones
    Viewer3D:
      type: object
      properties:
        scene:
          $ref: '#/components/schemas/Scene'
        slices:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              plane:
                type: string
                enum:
                - xy
                - xz
                - yz
              extents:
                type: array
                items:
                  type: number
                minItems: 4
                maxItems: 6
              field:
                type: string
                description: Field name fetchable via /fields/{field_name}
              shape:
                type: array
                items:
                  type: integer
            required:
            - name
            - plane
            - extents
            - field
            - shape
        streamlines:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: number
              minItems: 3
              maxItems: 3
      required:
      - slices
      - streamlines
    LawsonClass:
      type: object
      properties:
        key:
          type: string
        label_key:
          type: string
        threshold_ms:
          oneOf:
          - type: number
          - type: 'null'
      required:
      - key
      - label_key
      - threshold_ms
    LawsonTable:
      type: object
      properties:
        exceedance_probability:
          type: number
          default: 0.05
        comfort:
          type: array
          items:
            $ref: '#/components/schemas/LawsonClass'
          default:
          - key: sitting
            label_key: lawson.sitting
            threshold_ms: 4
          - key: standing
            label_key: lawson.standing
            threshold_ms: 6
          - key: strolling
            label_key: lawson.strolling
            threshold_ms: 8
          - key: business_walking
            label_key: lawson.business_walking
            threshold_ms: 10
          - key: uncomfortable
            label_key: lawson.uncomfortable
            threshold_ms: null
        safety_probability:
          type: number
          default: 0.00025
        safety:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              label_key:
                type: string
              threshold_ms:
                type: number
            required:
            - key
            - threshold_ms
          default:
          - key: unsafe_frail
            label_key: lawson.unsafe_frail
            threshold_ms: 15
          - key: unsafe_all
            label_key: lawson.unsafe_all
            threshold_ms: 20
      required:
      - exceedance_probability
      - comfort
      - safety_probability
      - safety
      description: Lawson LDDC defaults (ADR-15); thresholds strictly increasing.
    Comfort:
      type: object
      properties:
        study_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - pending
          - running
          - completed
          - failed
        lawson_hash:
          type: string
        coverage:
          type: number
          minimum: 0
          maximum: 1
        partial:
          type: boolean
          description: coverage < 0.95 (BR-12)
        class_areas:
          type: array
          items:
            type: object
            properties:
              class:
                type: string
              area_m2:
                type: number
              percent:
                type: number
            required:
            - class
            - area_m2
            - percent
        safety_areas:
          type: array
          items:
            type: object
            properties:
              class:
                type: string
              area_m2:
                type: number
              percent:
                type: number
        image:
          oneOf:
          - type: string
          - type: 'null'
        field:
          oneOf:
          - type: string
            description: lawson_class.u8
          - type: 'null'
      required:
      - study_id
      - status
      - coverage
      - partial
    ComparisonDifference:
      type: object
      properties:
        field:
          type: string
          enum:
          - kind
          - direction
          - z0
          - u_ref
          - dx
          - grid
          - analysis_height
          - section
        a: {}
        b: {}
      required:
      - field
      - a
      - b
    ComparisonCheck:
      type: object
      properties:
        comparable:
          type: boolean
        differences:
          type: array
          items:
            $ref: '#/components/schemas/ComparisonDifference'
      required:
      - comparable
    ComparisonAreas:
      type: object
      properties:
        a:
          $ref: '#/components/schemas/ZoneAreas'
        b:
          $ref: '#/components/schemas/ZoneAreas'
        reduction:
          $ref: '#/components/schemas/ZoneArea'
        thresholds:
          type: object
          properties:
            k_accel:
              type: number
            k_stagnation:
              type: number
            dk_reduction:
              type: number
      required:
      - a
      - b
      - reduction
      - thresholds
    ComparisonComfort:
      type: object
      properties:
        a:
          $ref: '#/components/schemas/Comfort'
        b:
          $ref: '#/components/schemas/Comfort'
      required:
      - a
      - b
    ExportCreate:
      type: object
      properties:
        result_id:
          type: string
          format: uuid
        layer:
          type: string
          enum:
          - k
          - zones
          - speed
          - delta_k
          - lawson
        compare_result_id:
          type: string
          format: uuid
        thresholds:
          type: object
          properties:
            k_accel:
              type: number
            k_stagnation:
              type: number
            dk_reduction:
              type: number
        dpi:
          type: integer
          minimum: 300
          maximum: 600
          default: 300
      required:
      - result_id
      - layer
      description: delta_k requires compare_result_id (comparable per BR-11).
    Export:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
          - cancelled
        progress:
          type: number
        error:
          oneOf:
          - $ref: '#/components/schemas/JobError'
          - type: 'null'
        file_ready:
          type: boolean
      required:
      - id
      - status
      - file_ready
    ExportAccepted:
      type: object
      properties:
        export_id:
          type: string
          format: uuid
      required:
      - export_id
    ReportCreate:
      type: object
      properties:
        study_ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
        baseline_study_id:
          type: string
          format: uuid
        include_comfort:
          type: boolean
          default: true
      required:
      - study_ids
    ReportAccepted:
      type: object
      properties:
        report_id:
          type: string
          format: uuid
      required:
      - report_id
    Report:
      type: object
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
          - cancelled
        progress:
          type: number
        error:
          oneOf:
          - $ref: '#/components/schemas/JobError'
          - type: 'null'
        created_at:
          type: string
          format: date-time
      required:
      - id
      - version
      - status
    Thresholds:
      type: object
      properties:
        k_accel:
          type: number
          default: 1.2
          exclusiveMinimum: 0
        k_stagnation:
          type: number
          default: 0.3
          exclusiveMinimum: 0
        dk_reduction:
          type: number
          default: -0.1
          maximum: 0
      required:
      - k_accel
      - k_stagnation
      - dk_reduction
    Settings:
      type: object
      properties:
        thresholds:
          $ref: '#/components/schemas/Thresholds'
        lawson:
          $ref: '#/components/schemas/LawsonTable'
        turbulence_intensity_default:
          type: number
          minimum: 0
          maximum: 1
          default: 0.25
        vegetation_cd:
          type: number
          minimum: 0.05
          maximum: 1.0
          default: 0.2
        alternatives_limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 8
      required:
      - thresholds
      - lawson
      - turbulence_intensity_default
      - vegetation_cd
      - alternatives_limit
      description: 'Constraint: k_accel > k_stagnation > 0.'
    SettingsPatch:
      type: object
      properties:
        thresholds:
          $ref: '#/components/schemas/Thresholds'
        lawson:
          $ref: '#/components/schemas/LawsonTable'
        turbulence_intensity_default:
          type: number
          minimum: 0
          maximum: 1
        vegetation_cd:
          type: number
          minimum: 0.05
          maximum: 1.0
        alternatives_limit:
          type: integer
          minimum: 1
          maximum: 20
    TemplatePayload:
      type: object
      properties:
        terrain_category:
          type: string
        z0_m:
          type: number
        thresholds:
          $ref: '#/components/schemas/Thresholds'
        lawson:
          $ref: '#/components/schemas/LawsonTable'
        facade_defaults:
          type: object
      additionalProperties: false
      description: Never contains location keys (lat, lon, latitude, longitude, elevation, location → 422 template_contains_location).
    Template:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - name
    TemplateCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        payload:
          $ref: '#/components/schemas/TemplatePayload'
      required:
      - name
      - payload
    ApplyTemplate:
      type: object
      properties:
        template_id:
          type: string
          format: uuid
      required:
      - template_id
  responses:
    Unauthorized:
      description: Missing, invalid or expired bearer token (code http_error)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Forbidden:
      description: Authenticated but role lacks permission (code forbidden), e.g. reviewer writing
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    NotFound:
      description: Missing id or another owner's id — byte-identical bodies
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Conflict:
      description: Conflicts with current state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Validation:
      description: Well-formed but invalid (code validation_error or a domain code)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    TooLarge:
      description: Upload exceeds the size limit (code upload_too_large)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Unavailable:
      description: A dependency is down (upstream or DB)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    RateLimited:
      description: Rate limit tier exhausted (code rate_limited)
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
