# Ráfaga OpenAPI contract (Phase 2). Generated from the architecture plan; source of truth for paths and schemas.
openapi: 3.1.0
info:
  title: Ráfaga API
  version: 1.0.0
  description: Contract between services/api, services/web and (for health) services/solver. Base path /api/v1. Every route
    requires a bearer JWT except the PUBLIC_PATHS (/health, /api/v1/auth/setup-status, /api/v1/auth/setup, /api/v1/auth/login).
    A foreign or missing resource returns a byte-identical 404. Errors use ErrorBody. Error codes per operation are listed
    in x-error-codes; x-roles lists required roles (reviewer writes → 403 forbidden). No preset location exists anywhere (BR-18).
servers:
- url: /
  description: Relative; the SPA resolves the host from /config.json (ADR-05)
security:
- bearerAuth: []
tags:
- name: system
- name: auth
- name: users
- name: projects
- name: shares
- name: geo
- name: wind
- name: geometry
- name: backgrounds
- name: alternatives
- name: facades
- name: scene
- name: simulations
- name: jobs
- name: results
- name: comfort
- name: comparisons
- name: exports
- name: reports
- name: settings
- name: templates
- name: solver (internal, not published)
paths:
  /health:
    get:
      operationId: getHealth
      tags:
      - system
      summary: API liveness and DB check (public, not rate limited)
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-error-codes:
      - db down → 503 status degraded
  /api/v1/auth/setup-status:
    get:
      operationId: getSetupStatus
      tags:
      - auth
      summary: Whether the first-run account must be created
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatus'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/setup:
    post:
      operationId: setupFirstAccount
      tags:
      - auth
      summary: Create the first (architect) account while no users exist
      description: Runs under pg_advisory_xact_lock; only succeeds when the users table is empty.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-error-codes:
      - 409 setup_already_done
      - 422 password_too_short
      - 429 rate_limited (RATE_LIMIT_LOGIN_PER_MINUTE)
  /api/v1/auth/login:
    post:
      operationId: login
      tags:
      - auth
      summary: Exchange credentials for a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-error-codes:
      - 401 invalid_credentials (identical for unknown email and wrong password)
      - 429 rate_limited (10/min/address)
  /api/v1/auth/me:
    get:
      operationId: getMe
      tags:
      - auth
      summary: Current user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/users:
    get:
      operationId: listUsers
      tags:
      - users
      summary: List local users
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-error-codes:
      - 403 forbidden
      x-roles:
      - architect
    post:
      operationId: createUser
      tags:
      - users
      summary: Create a local user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-error-codes:
      - 403 forbidden
      - 409 email_taken
      - 422 password_too_short
      x-roles:
      - architect
  /api/v1/users/{user_id}:
    delete:
      operationId: deleteUser
      tags:
      - users
      summary: Delete another user and their shares
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Success
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-error-codes:
      - 404 user_not_found
      - 409 cannot_delete_self
      x-roles:
      - architect
  /api/v1/system/status:
    get:
      operationId: getSystemStatus
      tags:
      - system
      summary: Service health and compute device
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/projects:
    get:
      operationId: listProjects
      tags:
      - projects
      summary: Projects owned by or shared with the caller (newest first)
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      operationId: createProject
      tags:
      - projects
      summary: Create a project without location
      description: Also creates the base alternative, empty geometry v1 and a wind_climates row (z0 1.0, no rose).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-error-codes:
      - 403 forbidden
      x-roles:
      - architect
  /api/v1/projects/{project_id}:
    get:
      operationId: getProject
      tags:
      - projects
      summary: Get a project
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-error-codes:
      - 404 project_not_found (byte-identical for foreign and missing ids)
    patch:
      operationId: updateProject
      tags:
      - projects
      summary: Rename or set analysis height
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPatch'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-error-codes:
      - 403 forbidden
      - 404 project_not_found
    delete:
      operationId: deleteProject
      tags:
      - projects
      summary: Delete project, cancel its jobs, remove its files
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Success
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-error-codes:
      - 403 forbidden
      - 404 project_not_found
  /api/v1/projects/{project_id}/duplicate:
    post:
      operationId: duplicateProject
      tags:
      - projects
      summary: Duplicate as 'Copia de <name>' (no jobs/results)
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-error-codes:
      - 404 project_not_found
  /api/v1/projects/{project_id}/location:
    put:
      operationId: setProjectLocation
      tags:
      - projects
      summary: Set location; fetch elevation unless given; compute ISA density
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-error-codes:
      - 422 coordinates_out_of_range
      - '503 elevation_unavailable (hint: enter elevation manually)'
  /api/v1/projects/{project_id}/shares:
    get:
      operationId: listShares
      tags:
      - shares
      summary: Reviewers with access
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Share'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-roles:
      - architect
  /api/v1/projects/{project_id}/shares/{user_id}:
    put:
      operationId: grantShare
      tags:
      - shares
      summary: Grant read access (idempotent)
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Success
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-error-codes:
      - 404 project_not_found
      - 404 user_not_found
      x-roles:
      - architect
    delete:
      operationId: revokeShare
      tags:
      - shares
      summary: Revoke read access
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Success
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-roles:
      - architect
  /api/v1/geo/search:
    get:
      operationId: searchPlaces
      tags:
      - geo
      summary: Open-Meteo geocoding proxy (cached 30 d)
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 100
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GeoResult'
                maxItems: 10
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-error-codes:
      - 503 geocoding_unavailable
  /api/v1/geo/elevation:
    get:
      operationId: getElevation
      tags:
      - geo
      summary: Elevation (coords rounded to 4 decimals) and ISA density
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          minimum: -90
          maximum: 90
      - name: lon
        in: query
        required: true
        schema:
          type: number
          minimum: -180
          maximum: 180
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Elevation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-error-codes:
      - 422 coordinates_out_of_range
      - 503 elevation_unavailable
  /api/v1/tiles/{z}/{x}/{y}.png:
    get:
      operationId: getTile
      tags:
      - geo
      summary: Cached OSM raster tile proxy
      parameters:
      - name: z
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
          maximum: 19
      - name: x
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
      - name: y
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: Success
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-error-codes:
      - 422 validation_error (z outside 0-19 or x/y outside 2^z)
      - 503 tile_unavailable
      - 429 rate_limited (RATE_LIMIT_TILES_PER_MINUTE)
  /api/v1/terrain-categories:
    get:
      operationId: listTerrainCategories
      tags:
      - wind
      summary: BR-08 roughness categories
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TerrainCategory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/projects/{project_id}/wind:
    get:
      operationId: getWind
      tags:
      - wind
      summary: Wind climate of the project
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WindClimate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      operationId: updateWind
      tags:
      - wind
      summary: Source, manual wind, terrain category, z0
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WindPatch'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WindClimate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-error-codes:
      - 409 rose_missing
  /api/v1/projects/{project_id}/wind/era5:
    post:
      operationId: fetchEra5Rose
      tags:
      - wind
      summary: Fetch ERA5 hourly wind and build the 16-sector rose
      description: 'Cache key: coordinates rounded to 0.1° + period; TTL 365 d.'
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Era5Request'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WindClimate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-error-codes:
      - 409 location_missing
      - '503 era5_unavailable (hint: manual entry)'
  /api/v1/projects/{project_id}/geometry:
    get:
      operationId: getGeometry
      tags:
      - geometry
      summary: Base-case buildings
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Geometry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    put:
      operationId: putGeometry
      tags:
      - geometry
      summary: Replace the building set
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeometryPut'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Geometry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-error-codes:
      - 409 version_conflict
      - 409 base_locked (alternatives exist, confirm_base_change not true)
  /api/v1/projects/{project_id}/geometry/validate:
    post:
      operationId: validateGeometry
      tags:
      - geometry
      summary: Validate without saving (BR-14)
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeometryValidateRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeometryValidation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/projects/{project_id}/geometry/imports:
    post:
      operationId: importGeometry
      tags:
      - geometry
      summary: Import DXF/STL/OBJ (R1) or IFC (R2)
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                unit:
                  type: string
                  enum:
                  - auto
                  - m
                  - cm
                  - mm
                  - ft
                  default: auto
                mode:
                  type: string
                  enum:
                  - append
                  - replace
                  default: append
                center:
                  type: boolean
                  default: true
              required:
              - file
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
