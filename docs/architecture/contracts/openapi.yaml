  /internal/solver/health:
    get:
      operationId: getSolverHealth
      tags:
      - solver (internal, not published)
      summary: Solver health — real path is GET /health on http://solver:8000 (compose network only)
      servers:
      - url: http://solver:8000
        description: Internal; never published to the host
      x-real-path: /health
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolverHealth'
        '503':
          description: DB unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolverHealth'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorBody:
      type: object
      properties:
        code:
          type: string
          description: Stable machine-readable code the SPA maps to es-CO copy
        message:
          type: string
          description: Lowercase English description of the condition
        details:
          type: object
          additionalProperties: true
        hint:
          type: string
          description: Suggested fix (code-mapped in the SPA)
      required:
      - code
      - message
      example:
        code: project_not_found
        message: project not found
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
        db:
          type: string
          enum:
          - ok
          - down
        version:
          type: string
      required:
      - status
      - db
      example:
        status: ok
        db: ok
        version: 1.0.0
    SolverHealth:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
        device:
          type: string
          enum:
          - cpu
          - gpu
        gpu_name:
          oneOf:
          - type: string
          - type: 'null'
        db:
          type: string
          enum:
          - ok
          - down
        lanes:
          type: object
          properties:
            heavy:
              type: object
              properties:
                busy:
                  type: boolean
                job_id:
                  oneOf:
                  - type: string
                    format: uuid
                  - type: 'null'
            light:
              type: object
              properties:
                busy:
                  type: integer
                  minimum: 0
      required:
      - status
      - device
      - db
      - lanes
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - architect
          - reviewer
        created_at:
          type: string
          format: date-time
      required:
      - id
      - email
      - role
      example:
        id: 00000000-0000-0000-0000-000000000001
        email: arq@example.test
        role: architect
    Credentials:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
          maxLength: 256
      required:
      - email
      - password
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 256
      required:
      - email
      - password
    UserCreate:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
          maxLength: 256
        role:
          type: string
          enum:
          - architect
          - reviewer
      required:
      - email
      - password
      - role
    Token:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
          - bearer
        expires_in:
          type: integer
          description: Seconds (JWT_TTL_MINUTES*60)
        user:
          $ref: '#/components/schemas/User'
      required:
      - access_token
      - token_type
      - expires_in
      - user
    SetupStatus:
      type: object
      properties:
        needs_setup:
          type: boolean
      required:
      - needs_setup
    SystemStatus:
      type: object
      properties:
        api:
          type: string
          enum:
          - ok
        db:
          type: string
          enum:
          - ok
          - down
        solver:
          type: object
          properties:
            online:
              type: boolean
              description: false when heartbeat_at older than 30 s
            device:
              oneOf:
              - type: string
                enum:
                - cpu
                - gpu
              - type: 'null'
            gpu_name:
              oneOf:
              - type: string
              - type: 'null'
            vram_total_bytes:
              oneOf:
              - type: integer
              - type: 'null'
            ram_budget_bytes:
              oneOf:
              - type: integer
              - type: 'null'
            cpu_cores:
              oneOf:
              - type: integer
              - type: 'null'
            mlups_2d:
              oneOf:
              - type: number
              - type: 'null'
            mlups_3d:
              oneOf:
              - type: number
              - type: 'null'
            heartbeat_at:
              oneOf:
              - type: string
                format: date-time
              - type: 'null'
          required:
          - online
      required:
      - api
      - db
      - solver
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        lat:
          oneOf:
          - type: number
            minimum: -90
            maximum: 90
          - type: 'null'
        lon:
          oneOf:
          - type: number
            minimum: -180
            maximum: 180
          - type: 'null'
        elevation_m:
          oneOf:
          - type: number
          - type: 'null'
        elevation_source:
          oneOf:
          - type: string
            enum:
            - open_meteo
            - manual
          - type: 'null'
        air_density_kg_m3:
          oneOf:
          - type: number
            description: 'ISA: 1.225(1-2.25577e-5 h)^4.25588 (BR-06)'
          - type: 'null'
        analysis_height_m:
          type: number
          minimum: 0.5
          maximum: 3.0
          default: 1.5
        role_on_project:
          type: string
          enum:
          - owner
          - reviewer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - lat
      - lon
      - analysis_height_m
      - role_on_project
      description: 'A new project has no location: lat/lon/elevation/density are null until the user places it (BR-18).'
      example:
        id: 00000000-0000-0000-0000-00000000000a
        name: Proyecto de prueba
        lat: null
        lon: null
        elevation_m: null
        elevation_source: null
        air_density_kg_m3: null
        analysis_height_m: 1.5
        role_on_project: owner
    ProjectSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        has_location:
          type: boolean
        updated_at:
          type: string
          format: date-time
        role_on_project:
          type: string
          enum:
          - owner
          - reviewer
      required:
      - id
      - name
      - has_location
      - updated_at
      - role_on_project
    ProjectCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
      required:
      - name
    ProjectPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        analysis_height_m:
          type: number
          minimum: 0.5
          maximum: 3.0
    LocationRequest:
      type: object
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lon:
          type: number
          minimum: -180
          maximum: 180
        elevation_m:
          oneOf:
          - type: number
            minimum: -500
            maximum: 9000
            description: Manual override; omitted → Open-Meteo
          - type: 'null'
      required:
      - lat
      - lon
      example:
        lat: 0.0
        lon: 0.0
    Share:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
      required:
      - user_id
      - email
    GeoResult:
      type: object
      properties:
        name:
          type: string
        admin1:
          oneOf:
          - type: string
          - type: 'null'
        country:
          oneOf:
          - type: string
          - type: 'null'
        lat:
          type: number
        lon:
          type: number
        elevation_m:
          oneOf:
          - type: number
          - type: 'null'
      required:
      - name
      - lat
      - lon
    Elevation:
      type: object
      properties:
        elevation_m:
          type: number
        air_density_kg_m3:
          type: number
        source:
          type: string
          enum:
          - open_meteo
      required:
      - elevation_m
      - air_density_kg_m3
      - source
    TerrainCategory:
      type: object
      properties:
        key:
          type: string
          enum:
          - open_sea
          - open
          - suburban
          - urban
          - dense_urban
        label_key:
          type: string
        z0_m:
          type: number
        default:
          type: boolean
      required:
      - key
      - label_key
      - z0_m
      - default
      example:
        key: urban
        label_key: terrain.urban
        z0_m: 1.0
        default: true
    WindSector:
      type: object
      properties:
        center_deg:
          type: number
          minimum: 0
          maximum: 337.5
        frequency:
          type: number
          minimum: 0
          maximum: 1
        mean_ms:
          type: number
        p50_ms:
          type: number
        p90_ms:
          type: number
        max_ms:
          type: number
        weibull_k:
          type: number
        weibull_c_ms:
          type: number
      required:
      - center_deg
      - frequency
      - mean_ms
      - p50_ms
      - p90_ms
      - max_ms
      - weibull_k
      - weibull_c_ms
    WindRose:
      type: object
      properties:
        sectors:
          type: array
          items:
            $ref: '#/components/schemas/WindSector'
          minItems: 16
          maxItems: 16
          description: Centred on 0, 22.5 … 337.5 deg, meteorological 'from' convention
        calm_fraction:
