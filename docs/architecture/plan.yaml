      - {id: API-19, work_package: WP-API, kind: endpoint, name: "DELETE /api/v1/projects/{project_id}/shares/{user_id}", acceptance: "Owner revokes access (204); the reviewer then receives 404 project_not_found on that project."}
      - {id: API-20, work_package: WP-API, kind: endpoint, name: GET /api/v1/geo/search, acceptance: "Proxies Open-Meteo geocoding for q (2-100 chars, language es) returning up to 10 {name, admin1, country, lat, lon, elevation_m?}; cached 30 d; upstream down and no cache → 503 geocoding_unavailable."}
