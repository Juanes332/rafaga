      - {id: API-63, work_package: WP-API, kind: endpoint, name: GET /api/v1/comparisons/areas, acceptance: "For comparable a (base) and b returns per alternative area_m2/percent for acceleration, stagnation and, for b, reduction (ΔK below dk_reduction) computed with numpy on the K fields."}
      - {id: API-64, work_package: WP-API, kind: endpoint, name: GET /api/v1/comparisons/comfort, acceptance: "For two studies of the same project and kind returns Lawson class areas side by side with each coverage and partial flag."}
      - {id: API-65, work_package: WP-API, kind: endpoint, name: POST /api/v1/exports, acceptance: "Accepts {result_id, layer k|zones|speed|delta_k|lawson, compare_result_id?, thresholds?, dpi ≥300 default 300} and returns 202 {export_id} after enqueuing a light-lane render job; results missing → 409 results_missing."}
      - {id: API-66, work_package: WP-API, kind: endpoint, name: "GET /api/v1/exports/{export_id}", acceptance: "Returns {status, progress, error, file_ready}."}
      - {id: API-67, work_package: WP-API, kind: endpoint, name: "GET /api/v1/exports/{export_id}/file", acceptance: "Streams the PNG with Content-Disposition; not ready → 409 export_not_ready."}
      - {id: API-68, work_package: WP-API, kind: endpoint, name: "POST /api/v1/projects/{project_id}/reports", acceptance: "Accepts {study_ids[], baseline_study_id?, include_comfort} and enqueues a report job whose payload snapshots project, location, rose, parameters, area tables and the FR-48 disclaimer; 202 {report_id}; no completed results → 409 results_missing."}
      - {id: API-69, work_package: WP-API, kind: endpoint, name: "GET /api/v1/projects/{project_id}/reports", acceptance: "Lists reports {id, version, status, created_at}."}
      - {id: API-70, work_package: WP-API, kind: endpoint, name: "GET /api/v1/reports/{report_id}", acceptance: "Returns report status, progress and error."}
      - {id: API-71, work_package: WP-API, kind: endpoint, name: "GET /api/v1/reports/{report_id}/file", acceptance: "Streams application/pdf with filename rafaga-<project-slug>-v<version>.pdf; not ready → 409 report_not_ready."}
      - {id: API-72, work_package: WP-API, kind: endpoint, name: GET /api/v1/settings, acceptance: "Returns the caller's settings with defaults k_accel 1.2, k_stagnation 0.3, dk_reduction -0.1, the ADR-15 Lawson table, turbulence_intensity_default 0.25, vegetation_cd 0.2, alternatives_limit 8."}
      - {id: API-73, work_package: WP-API, kind: endpoint, name: PATCH /api/v1/settings, acceptance: "Validates ranges (k_accel > k_stagnation > 0, Lawson thresholds strictly increasing, alternatives_limit 1-20) and returns the updated settings; invalid → 422."}
      - {id: API-74, work_package: WP-API, kind: endpoint, name: GET /api/v1/templates, acceptance: "Lists the caller's templates {id, name, created_at}."}
      - {id: API-75, work_package: WP-API, kind: endpoint, name: POST /api/v1/templates, acceptance: "Saves {name, payload{terrain_category, z0_m, thresholds, lawson, facade_defaults}}; location keys rejected with 422 template_contains_location."}
      - {id: API-76, work_package: WP-API, kind: endpoint, name: "DELETE /api/v1/templates/{template_id}", acceptance: "Deletes an owned template; foreign id → 404 template_not_found identical to missing."}
      - {id: API-77, work_package: WP-API, kind: endpoint, name: "POST /api/v1/projects/{project_id}/apply-template", acceptance: "Applies {template_id} to wind roughness and the caller's thresholds without touching location; returns the updated WindClimate."}
      - {id: JOB-A01, work_package: WP-API, kind: job, name: Admin seed (insert-if-absent), acceptance: "At startup, when ADMIN_EMAIL and ADMIN_PASSWORD are both non-empty and no user with that email exists, inserts an architect; an existing user's password is never overwritten (test)."}
      - {id: JOB-A02, work_package: WP-API, kind: job, name: Retention purge, acceptance: "Daily lifespan task deletes failed/cancelled jobs (and their output dirs) finished more than JOB_RETENTION_DAYS=90 days ago; completed jobs referenced by results are kept."}
      - {id: JOB-A03, work_package: WP-API, kind: job, name: Aggregate template on study creation, acceptance: "POST /simulations stores studies.aggregate_template (rose snapshot, site roughness, the caller's Lawson table, turbulence_intensity_default, lawson_hash, output grid) when the wind source is era5 and NULL when manual, matching job-contract.md §3.4 minus result_refs."}
      - {id: IMG-API, work_package: WP-API, kind: artifact, name: services/api/Dockerfile + .dockerignore, acceptance: "Multi-stage python:3.12-slim image, USER 10001:10001, /data owned by 10001, EXPOSE 8000, HEALTHCHECK on /health, runs `alembic upgrade head` then uvicorn; `docker build services/api` succeeds."}
      # ---------------- WP-SOLVER (fastapi-senior) — services/solver ----------------
      - {id: SOL-01, work_package: WP-SOLVER, kind: endpoint, name: GET /health (solver), acceptance: "Unauthenticated 200 {status, device cpu|gpu, gpu_name|null, db, lanes{heavy{busy,job_id}, light{busy}}}; 503 when the DB is unreachable; the only HTTP route of the service."}
      - {id: SOL-02, work_package: WP-SOLVER, kind: job, name: Queue supervisor and claim, acceptance: "Claims jobs per lane with the exact SKIP LOCKED statement of job-contract.md §4, wakes on NOTIFY rafaga_jobs or every 2 s, never runs two heavy jobs at once, runs up to LIGHT_LANE_CONCURRENCY light jobs; a test with two supervisors proves no job is claimed twice."}
      - {id: SOL-03, work_package: WP-SOLVER, kind: job, name: Device selection, probe and heartbeat, acceptance: "`python -m app.services.device.device_probe` exits 0 only after a CuPy RawKernel ran on the GPU; at start the solver benchmarks MLUPS (≤5 s) and upserts solver_nodes every 5 s with device, gpu_name, vram, ram budget, cores, mlups; RAFAGA_DEVICE=cpu forces NumPy."}
      - {id: SOL-04, work_package: WP-SOLVER, kind: job, name: Orphan recovery, acceptance: "On start, jobs in running whose heartbeat_at is older than 60 s become failed with error_code worker_restarted and resumable=true; their partial output dirs are removed."}
      - {id: SOL-05, work_package: WP-SOLVER, kind: job, name: Cancellation, acceptance: "A running job with cancel_requested=true reaches status cancelled within 10 s (cooperative check ≤1 s, hard kill of the child at 8 s), GPU memory is released and the next job starts."}
      - {id: SOL-06, work_package: WP-SOLVER, kind: job, name: Scene voxelizer, acceptance: "Rasterizes scene.schema.json primitives onto the payload grid (plan slice at analysis height, vertical section, 3D) with 4× supersampling; solids with coverage ≥0.5 → wall, thinner → porous β=1-coverage; screens/vegetation → porous ids; golden-file tests on the contract examples."}
      - {id: SOL-07, work_package: WP-SOLVER, kind: job, name: plan2d simulation (D2Q9), acceptance: "Runs a plan2d payload on GPU or CPU and writes fields K, ux, uy, speed, mask, ti plus manifest.json per job-contract.md §5; standard 400×300 case completes in ≤2 min on RTX 4060 and ≤10 min on 16-core CPU (benchmark SOL-18)."}
      - {id: SOL-08, work_package: WP-SOLVER, kind: job, name: section2d simulation, acceptance: "Runs a vertical (s,z) D2Q9 case with log-law inlet, ground wall function and slip top; writes K, us, uz, speed, mask on the section output grid."}
      - {id: SOL-09, work_package: WP-SOLVER, kind: job, name: volume3d simulation (D3Q19 LES), acceptance: "Runs D3Q19 regularized BGK + Smagorinsky with ADR-12 BCs and porous forcing; writes the analysis-height slice on the project output grid (K, ux, uy, uz, speed, ti, mask), vertical slices and viewer3d.json streamlines; 25 M nodes uses ≤7.2 GB VRAM and sustains ≥100 MLUPS (target 400)."}
      - {id: SOL-10, work_package: WP-SOLVER, kind: job, name: Convergence and averaging monitor, acceptance: "Implements ADR-11 exactly; manifest.convergence reports {converged, flow_throughs_spinup, flow_throughs_averaged, rel_change_last, checks}; cap reached → converged=false and warning convergence_cap_reached."}
      - {id: SOL-11, work_package: WP-SOLVER, kind: job, name: Post-processing and previews, acceptance: "Computes K=|U|/U_ref(z_a) on the north-up output grid (bilinear from the rotated sim grid), stats {k_mean,k_max,k_p95}, comparability_key, and 150 dpi previews k.png (cmocean speed), speed.png, zones.png (hatched) with numeric legends."}
      - {id: SOL-12, work_package: WP-SOLVER, kind: job, name: aggregate (Lawson comfort), acceptance: "For a study computes per-cell exceedance with ADR-15 (Weibull, GEM, roughness transfer, renormalised coverage) and writes lawson_class.u8, exceedance.f32, lawson.png and a comfort_results row with class areas, coverage and partial."}
      - {id: SOL-13, work_package: WP-SOLVER, kind: job, name: render (export PNG), acceptance: "Renders layer k|zones|speed|delta_k|lawson at the requested dpi (≥300, verified in PNG pHYs metadata) with legend and units, scale bar, north arrow, reference wind (direction and U10), and the disclaimer line."}
      - {id: SOL-14, work_package: WP-SOLVER, kind: job, name: report (PDF), acceptance: "Builds an A4 PDF with WeasyPrint from the payload snapshot (project, location, rose chart, parameters, maps, area table, Lawson, FR-48 disclaimer on every page footer) in ≤30 s with 6 maps; Literata/Hanken Grotesk embedded."}
      - {id: SOL-15, work_package: WP-SOLVER, kind: job, name: Validation — square cylinder, acceptance: "pytest -m slow test runs 2D square cylinder (Re 150, blockage 5 %, D=20 cells) and asserts Strouhal 0.13-0.15 and mean recirculation length within the documented literature band."}
      - {id: SOL-16, work_package: WP-SOLVER, kind: job, name: Validation — AIJ case A, acceptance: "pytest -m slow (GPU if available) runs the 1:1:2 building and asserts reverse flow behind the building at z=0.125H with reattachment between 1.0H and 2.5H downstream and roof separation present; plots stored as test artefacts."}
      - {id: SOL-17, work_package: WP-SOLVER, kind: job, name: CPU/GPU equivalence, acceptance: "Same seeded payload on NumPy and CuPy gives |mean K_gpu - mean K_cpu|/mean K_cpu ≤ 0.02 (skipped with reason when no GPU)."}
      - {id: SOL-18, work_package: WP-SOLVER, kind: job, name: Benchmarks, acceptance: "`python -m app.services.bench.bench_runner` runs the versioned 400×300 2D case and a 3D case 3 times and prints median wall time, MLUPS and peak memory as JSON (NFR-01/02/03 evidence)."}
      - {id: SOL-19, work_package: WP-SOLVER, kind: job, name: Pre-run memory guard, acceptance: "Before allocating, re-checks payload memory against the live device budget and fails fast with error_code mesh_too_large and a hint containing the proposed dx when it does not fit."}
      - {id: SOL-20, work_package: WP-SOLVER, kind: job, name: Study completion → aggregate enqueue, acceptance: "When the last heavy job of a study reaches a terminal state, in the same transaction (study row locked FOR UPDATE) inserts exactly one light aggregate job from studies.aggregate_template + result_refs if the template is not NULL, ≥1 result exists and no aggregate with that lawson_hash is queued, running or completed (concurrency test with two finishing jobs)."}
      - {id: IMG-SOLVER, work_package: WP-SOLVER, kind: artifact, name: services/solver/Dockerfile + .dockerignore, acceptance: "Multi-stage python:3.12-slim with cupy-cuda12x[ctk], numpy, matplotlib, cmocean, weasyprint deps; USER 10001:10001; EXPOSE 8000; HEALTHCHECK on /health; starts CPU-only without a GPU and uses the GPU under compose.gpu.yaml."}
      # ---------------- WP-WEB (react-senior + frontend-design) — services/web ----------------
      - {id: SCR-01, work_package: WP-WEB, kind: screen, name: Crear cuenta local, acceptance: "Shown on every route while GET /auth/setup-status says needs_setup; submits POST /auth/setup, shows the 10-character minimum inline on 422 and lands on Proyectos with 'Crea tu primer proyecto'."}
      - {id: SCR-02, work_package: WP-WEB, kind: screen, name: Iniciar sesión, acceptance: "Shown when setup is done and no valid token; POST /auth/login, 401 shows 'Correo o contraseña incorrectos', 429 shows the wait time from Retry-After."}
      - {id: SCR-03, work_package: WP-WEB, kind: screen, name: Proyectos, acceptance: "Lists GET /projects with name, location state and last update; create, rename, duplicate and delete (confirmation dialog naming the project); empty state 'Crea tu primer proyecto'."}
      - {id: SCR-04, work_package: WP-WEB, kind: screen, name: Espacio de trabajo (shell), acceptance: "Left step rail 1-6 Proyecto→Comparar with locked steps (Viento/Simular locked until location set), central canvas, right inspector, compute badge 'GPU: <modelo>' or 'CPU' and service health from GET /system/status, theme toggle, permanent disclaimer on result views."}
      - {id: SCR-05, work_package: WP-WEB, kind: screen, name: Paso 1 — Proyecto (ubicación), acceptance: "MapLibre map through /tiles with OSM attribution, no marker on a new project; click, place search (GET /geo/search) or typed coordinates call PUT /location and show lat/lon (5 decimals), elevation and ISA density within 5 s; elevation failure opens manual elevation input; offline tiles show a neutral grid."}
      - {id: SCR-06, work_package: WP-WEB, kind: screen, name: Paso 2 — Geometría (editor), acceptance: "SVG metric editor draws rectangles/polygons (default 12 m height), move/scale/delete, grid snap, height slider + numeric field, ≥50-level undo/redo, self-intersection warning, issues list from /geometry/validate, saves with PUT /geometry; empty state 'Dibuja o carga tu primer edificio'; ≤100 ms p95 interactions with 200 blocks."}
      - {id: SCR-07, work_package: WP-WEB, kind: screen, name: Importar geometría, acceptance: "Dialog uploads DXF/STL/OBJ/IFC to /geometry/imports, confirms detected unit, then shows the import report (added, missing height with inline height inputs, ignored with reasons) or the 422 cause and fix."}
      - {id: SCR-08, work_package: WP-WEB, kind: screen, name: Calcar plano, acceptance: "Uploads image/PDF (page picker for multi-page), two-point calibration with real distance, opacity control, and a ruler whose measurement differs ≤1 % from the calibrated distance; >25 MB shows the limit and how to reduce it."}
      - {id: SCR-09, work_package: WP-WEB, kind: screen, name: Vista 3D de geometría, acceptance: "react-three-fiber orbit/zoom view of GET /alternatives/{id}/scene solids and porous zones (translucent), updating when a height changes."}
      - {id: SCR-10, work_package: WP-WEB, kind: screen, name: Paso 3 — Viento, acceptance: "Fetches ERA5 rose (POST /wind/era5) and renders a 16-sector SVG rose with frequency and p50/p90/max table; terrain category select fills z0 (editable); manual direction/U10 mode; density with formula; offline without cache offers manual entry with explanation."}
      - {id: SCR-11, work_package: WP-WEB, kind: screen, name: Paso 4 — Alternativas y fachadas, acceptance: "Lists/creates/renames/deletes alternatives (limit message on 409), selects a building edge on the canvas and applies one of five strategies with defaults/ranges/help from /facade-strategies; clamped values show the adjustment message; base marked immutable."}
      - {id: SCR-12, work_package: WP-WEB, kind: screen, name: Paso 5 — Simular, acceptance: "Chooses kind (planta 2D, corte vertical, 3D), directions on a clickable rose (1-16, coverage % shown), cell size, device (auto/CPU/GPU); shows POST /simulations/estimate (nodes, memory vs budget, ETA, proposed dx) before launch; mesh_too_large offers the proposed dx."}
      - {id: SCR-13, work_package: WP-WEB, kind: screen, name: Trabajos y progreso, acceptance: "Polls GET /simulations/{id} every 1 s while active and shows per-direction progress bar, phase, ETA, device and cancel; survives page reload; failed jobs show cause and solution and a retry for resumable ones."}
      - {id: SCR-14, work_package: WP-WEB, kind: screen, name: Resultados en planta, acceptance: "Draws K from /fields/K with the cmocean speed LUT and numeric legend (unidades), animated WebGL2 particles from ux/uy (static streamlines under prefers-reduced-motion), Zonas toggle with hatch patterns + labels re-thresholded client-side, area table from /zones, disclaimer visible."}
      - {id: SCR-15, work_package: WP-WEB, kind: screen, name: Confort Lawson, acceptance: "Shows Lawson classes from /comfort with coverage %, 'Parcial' badge under 95 %, class areas, plain-language note in Literata when a class is selected, and recompute after settings change."}
      - {id: SCR-16, work_package: WP-WEB, kind: screen, name: Visor 3D de resultados, acceptance: "Renders buildings, the analysis-height slice and vertical slices textured from viewer3d fields plus streamlines, orbit/zoom, with the K legend."}
      - {id: SCR-17, work_package: WP-WEB, kind: screen, name: Corte vertical, acceptance: "Draws a section line on the plan (upwind→downwind), launches section2d and displays the (s,z) speed field with legend and height axis."}
      - {id: SCR-18, work_package: WP-WEB, kind: screen, name: Paso 6 — Comparar (pantalla completa), acceptance: "Full-screen before/after swipe slider movable by drag and by arrow keys (2 %, Shift 10 %), ΔK toggle with cmocean balance and reduction hatch, area table per zone and Lawson class from /comparisons/areas and /comparisons/comfort; 422 shows which parameters differ."}
      - {id: SCR-19, work_package: WP-WEB, kind: screen, name: Exportar PNG, acceptance: "Dialog picks layer and dpi (≥300), POSTs /exports, polls status and downloads the file; disabled with explanation when the view has no results."}
      - {id: SCR-20, work_package: WP-WEB, kind: screen, name: Informes PDF, acceptance: "Selects studies and baseline, POSTs /reports, lists versions with status and downloads the PDF."}
      - {id: SCR-21, work_package: WP-WEB, kind: screen, name: Ajustes, acceptance: "Edits K thresholds, ΔK threshold, Lawson table, turbulence intensity, vegetation Cd and alternatives limit via PATCH /settings with inline range errors; zones update without re-simulating."}
      - {id: SCR-22, work_package: WP-WEB, kind: screen, name: Usuarios y acceso, acceptance: "Architect creates reviewer/architect users and shares or revokes projects; reviewers see read-only UI with launch/edit controls hidden and a 403 explained if hit."}
      - {id: SCR-23, work_package: WP-WEB, kind: screen, name: Plantillas, acceptance: "Saves the current roughness/thresholds/facade defaults as a template (never location) and applies one to a project."}
      - {id: WEB-01, work_package: WP-WEB, kind: artifact, name: Runtime config bootstrap, acceptance: "Before rendering, fetches /config.json (no-store) and builds the API base as location.protocol//location.hostname:apiPort (or apiBaseUrl when set); a missing or invalid config shows 'No se encuentra el servicio. Ejecuta start de nuevo.'."}
      - {id: WEB-02, work_package: WP-WEB, kind: artifact, name: Design tokens and themes, acceptance: "src/styles tokens implement contracts/design-system.md (light/dark, type scale, radii, focus ring); axe-core reports 0 serious/critical violations on every screen in both themes."}
      - {id: WEB-03, work_package: WP-WEB, kind: artifact, name: Particle flow engine, acceptance: "WebGL2 ping-pong particle advection over a velocity texture (≥16k particles at 60 fps on integrated GPUs, fades trails), pausable, falls back to static streamlines without WebGL2 or with reduced motion."}
      - {id: WEB-04, work_package: WP-WEB, kind: artifact, name: Colormap LUTs, acceptance: "256-entry cmocean speed and balance LUTs generated from cmocean RGB tables match the solver previews (unit test samples 5 points ±1/255)."}
      - {id: WEB-05, work_package: WP-WEB, kind: artifact, name: i18n es-CO resources, acceptance: "All UI strings live in src/locales/es-CO/*.json via i18next; numbers formatted with Intl es-CO; a test fails on hard-coded user-visible strings in components."}
      - {id: IMG-WEB, work_package: WP-WEB, kind: artifact, name: services/web/Dockerfile + entrypoint + .dockerignore, acceptance: "node:24-slim build with pnpm --frozen-lockfile, runtime runs as node, docker-entrypoint.sh writes dist/config.json from RAFAGA_API_PORT then execs `serve -s dist -l tcp://0.0.0.0:3000`; serve.json sets Cache-Control no-store for config.json; HEALTHCHECK fetches /; .nvmrc=24."}
      # ---------------- WP-BACKLOG — post-handoff backlog (owner + skill per row; ADR-27..29) ----------------
      # Rows keep their owner component's skill binding. Each row is closed only by the test or
      # artefact named in its acceptance. User actions (real Windows run) are listed, not faked.
      - {id: BL-01, work_package: WP-BACKLOG, owner: solver, skill: fastapi-senior, kind: job, name: "3D LES with resolved gusts (ADR-27)", acceptance: "A short seeded GPU volume3d run on an empty domain (pytest -m gpu) measures, at the analysis height in the far field, I_u = sigma_u/U_mean between 0.15 and 0.30 and mean K between 0.9 and 1.1; the volume3d collision uses the accepted hybrid closure (ADR-27 amendment, user decision): 6 RANS layers at 0.8 kappa min(z+z0,d_wall) then C_s dx, plus PI far-field nudging (unit test on hybrid_length_field); a Lawson aggregate over a volume3d result uses the resolved ti field (GEM > U where resolved ti > (1.85-1)/3 ~ 0.283 and G = 1 below it (Lawson G = max(1,(1+3I)/1.85)), asserted) and the aggregate manifest field gust_factor states the G=1 floor applies to cells without valid ti statistics (test, plus a Lawson aggregate over a real volume3d result); services/solver/README.md marks the 'Equilibrium ABL' deviation as superseded for volume3d."}
      - {id: BL-02, work_package: WP-BACKLOG, owner: api + solver, skill: fastapi-senior, kind: job, name: "3D domain top ~5H within 8 GB VRAM (ADR-27, ADR-10)", acceptance: "api grid_service resolves volume3d with nz = ceil(5 H / dx) (plan2d/section2d keep 6H) and still enforces blockage < 3 % by raising the top when needed (unit tests for both cases); the estimate for a reference 25 M-node volume3d returns memory_bytes <= 7.2 GB with fits=true on an 8188 MiB GPU; the solver SOL-19 guard accepts that payload and a short GPU run reports peak VRAM <= 7.2 GB."}
      - {id: BL-03, work_package: WP-BACKLOG, owner: solver, skill: fastapi-senior, kind: job, name: "Celosía perpendicular to wind shelters downstream (ADR-13)", acceptance: "A seeded test (plan2d fast; volume3d marked gpu) runs a building with and without a screen (porosity 0.40) on the windward/leeward edge perpendicular to the wind and asserts mean K in the sheltered zone (downstream of the screen, within 3 screen heights, at z_a) is reduced by >= 10 % relative to the bare case; the zone and the threshold are constants in the test, not tuned per run."}
      - {id: BL-04, work_package: WP-BACKLOG, owner: ops, skill: engineering-canon, kind: artifact, name: "Windows start/stop/reset scripts reviewed and parsed", acceptance: "start.ps1, stop.ps1, reset.ps1 and scripts/rafaga.ps1 parse with zero errors via [System.Management.Automation.Language.Parser]::ParseFile and Invoke-ScriptAnalyzer reports zero Error-severity findings, both run in a pinned PowerShell container image by a committed script (scripts/lint-ps.sh); .bat wrappers reviewed (CRLF, -NoProfile -ExecutionPolicy Bypass, pause on error); docs/ops/windows-checklist.md lists the manual steps (Docker Desktop + WSL2, GPU probe, start, first login, stop keeps data, reset asks 'borrar'); the real-Windows run is a user action and stays open until the user reports it."}
      - {id: BL-05, work_package: WP-BACKLOG, owner: solver + ops, skill: "fastapi-senior (Dockerfile) + engineering-canon (compose/scripts)", kind: artifact, name: "Solver image slimmed + optional registry pull (ADR-29)", acceptance: "`docker image inspect -f '{{.Size}}'` of the solver image built from services/solver is <= 3000000000 bytes; inside that image the ADR-17 device probe (RawKernel + reduction) passes under compose.gpu.yaml and the container starts healthy without a GPU; with RAFAGA_IMAGE_REGISTRY empty `docker compose config` shows build contexts only, with it set it shows ${RAFAGA_IMAGE_REGISTRY}/rafaga-<svc>:${RAFAGA_VERSION} images; start.sh/start.ps1 pull when set and fall back to a local build on pull failure (tested with an unreachable registry); .env.example and README document both variables."}
      - {id: BL-06, work_package: WP-BACKLOG, owner: api + web, skill: "fastapi-senior (api) + react-senior/frontend-design (web)", kind: screen, name: "CPU 3D warning with ETA and explicit confirmation (NFR-03, ADR-28)", acceptance: "api: GET /api/v1/system/status returns 401 without bearer and solver.device/mlups_3d from the freshest solver_nodes row; POST /simulations/estimate for volume3d on a cpu node returns device=cpu and eta_seconds computed from mlups_3d (ADR-16 constant when null). web (Vitest + MSW): in Paso 5 a volume3d estimate with device cpu opens a modal showing ETA (h min), node count and the NFR-03 limit; Cancel (initial focus, Escape) sends nothing; 'Lanzar en CPU' sends POST /simulations; GPU estimates and 2D kinds launch without the modal; solver offline disables launch with an explanation; axe reports no serious violations in the modal."}
      - {id: BL-07, work_package: WP-BACKLOG, owner: solver, skill: fastapi-senior, kind: job, name: "PDF wind-arrow badge size", acceptance: "A report/render test measures the wind-direction badge bounding box on every map of a generated PDF/PNG and asserts its longest side <= 12 % of the map's shorter side (tolerance +0.5 %), for both portrait and landscape map aspect ratios, while staying legible (arrow and U10 label present)."}
      - {id: BL-08, work_package: WP-BACKLOG, owner: web, skill: "react-senior + frontend-design", kind: artifact, name: "Particle fps measured in a real browser", acceptance: "A committed script (services/web/scripts/measure-particle-fps.mjs, Playwright headed Chromium with hardware acceleration at 1920x1080) opens a plan result with the particle layer, samples requestAnimationFrame for >= 20 s after warm-up and writes JSON {mean_fps, p5_fps, gpu_renderer, particles}; a recorded run on the reference laptop shows mean >= 50 and p5 >= 30 with the renderer string not SwiftShader/llvmpipe (software rendering does not count); results file committed under services/web/perf/."}
      - {id: BL-09, work_package: WP-BACKLOG, owner: contracts + solver, skill: "software-architect (contract text) + fastapi-senior (pinning test)", kind: artifact, name: "Job contract v1.1: api-owned columns read by the solver", acceptance: "contracts/job-contract.md v1.1 adds a section listing every api-owned table/column the solver reads (at least alternatives.id and alternatives.is_base; alternatives.project_id is documented as NOT read, the project comes from results.project_id, matching job-contract.md section 2.7) as read-only, additive and documentary (no DDL change; schema_meta.job_contract_version keeps major '1'); a solver test parses the solver's SQL for api-owned columns and fails when the set differs from the documented list, and a test against the contract DDL asserts alternatives.is_base exists as boolean NOT NULL."}
      - {id: BL-10, work_package: WP-BACKLOG, kind: feature, name: GPS location, acceptance: "A 'Usar mi ubicación' button uses navigator.geolocation (high accuracy, timeout) and shows the accuracy in m, with graceful Spanish messages for denied, unavailable, timeout and insecure context (e.g. LAN http IP); CoordinateForm also accepts DMS and DDM (5°32'13\"N 73°21'38\"W, 5 32.2 N) with N/S/E/W and O for Oeste, comma or dot decimals, besides decimal; LocationSummary shows decimal and DMS. Coordinates never leave the machine except the existing rounded Open-Meteo call (NFR-15)."}
      - {id: BL-11, work_package: WP-BACKLOG, kind: feature, name: Cardinal points, acceptance: "Reusable accessible CompassRose (N, NE, E, SE, S, SO, O, NO; N emphasized) on LocationMap, PlanCanvas, Geometry3DView (gizmo following camera azimuth) and FlowCanvas; every wind direction in the UI reads 'desde NE · 45°' (meteorological FROM convention), including WindRose axis labels; shared degToCardinal(deg, points=16) util with tests."}
      - {id: BL-12, work_package: WP-BACKLOG, owner: web+solver, kind: feature, name: Strategy-effect summary for architects, acceptance: "(1) Compare screen shows, per alternative vs base, a plain-Spanish summary card built only from existing api data (K fields, /comparisons/areas, /comparisons/comfort; no new api field): '<alternativa> reduce/aumenta el viento un X % en la zona protegida' (mean K change over cells with dK < dk_reduction) or, without protected cells, in the whole analysed area; Lawson shifts (m2 that pass from class X to Y, m2 that improve/worsen at least, unsafe-gust area before/after); verdict mejora / empeora / sin cambio relevante with |mean dK| < 3 % = sin cambio; CFD jargon only inside an expandable details. The PDF comparison section (report_comparison.py) emits the same sentences (golden-string tests on web and solver agree). (2) Every warning code that can reach the UI (solver: domain_top_capped, low_reynolds, local_mach_spikes, convergence_cap_reached, element_not_representable_2d; scene: element_orphaned, element_degenerate, setback_tiers_truncated, below_analysis_height, above_building_clamped) has an es-CO label in results.json; a test fails when a code lacks a label. (3) A non-alarming model-confidence note ('Ráfaga sirve para comparar alternativas y detectar zonas incómodas en etapas de diseño. No reemplaza un ensayo en túnel de viento para proyectos críticos.') is merged into the permanent FR-48 disclaimer (expandable detail under the strip on result and compare screens) and into the PDF closing section; the short FR-48 line is unchanged."}
      # ---------------- WP-OPS (engineering-canon) — repo root ----------------
      - {id: OPS-01, work_package: WP-OPS, kind: artifact, name: compose.yaml, acceptance: "name: rafaga; services db (postgres official, rafaga-db volume, pg_isready healthcheck, unpublished), api (127.0.0.1:${RAFAGA_API_PORT:-0}:8000, rafaga-data:/data, depends on db healthy), solver (unpublished, rafaga-data:/data, depends on api healthy), web (127.0.0.1:${RAFAGA_WEB_PORT:-0}:3000, RAFAGA_API_PORT env); no bind mounts; `docker compose config` validates."}
      - {id: OPS-02, work_package: WP-OPS, kind: artifact, name: compose.gpu.yaml, acceptance: "Override adds deploy.resources.reservations.devices [{driver: nvidia, count: all, capabilities: [gpu]}] to solver only; `docker compose -f compose.yaml -f compose.gpu.yaml config` validates."}
      - {id: OPS-03, work_package: WP-OPS, kind: artifact, name: start.sh + scripts/rafaga.sh, acceptance: "On Linux: checks docker and compose v2 (else message + install link, exit 1), creates .env with generated POSTGRES_PASSWORD/JWT_SECRET without printing them, runs the ADR-17 GPU probe, `up -d --build`, persists kernel-assigned ports on first run (ADR-05), retries once after clearing a busy port, waits for api /health and web, prints 'Ráfaga está lista en http://localhost:<port>' and the device, opens the browser with xdg-open."}
      - {id: OPS-04, work_package: WP-OPS, kind: artifact, name: start.ps1 + scripts/rafaga.ps1, acceptance: "Same behaviour as OPS-03 on Windows PowerShell 5.1+ with Docker Desktop/WSL2, secrets from System.Security.Cryptography.RandomNumberGenerator, browser via Start-Process."}
      - {id: OPS-05, work_package: WP-OPS, kind: artifact, name: start.bat, acceptance: "Double-clickable wrapper running `powershell -NoProfile -ExecutionPolicy Bypass -File start.ps1` and pausing on error."}
      - {id: OPS-06, work_package: WP-OPS, kind: artifact, name: stop.sh / stop.ps1 / stop.bat, acceptance: "Runs `docker compose -p rafaga stop`; volumes and .env are untouched (data visible again after start)."}
      - {id: OPS-07, work_package: WP-OPS, kind: artifact, name: reset.sh / reset.ps1 / reset.bat, acceptance: "Asks the user to type 'borrar', then `docker compose -p rafaga down -v --remove-orphans` and removes persisted ports from .env (secrets kept); any other answer aborts without changes."}
      - {id: OPS-08, work_package: WP-OPS, kind: artifact, name: .env.example, acceptance: "Lists every variable of contracts.deployment.env_vars with empty secrets and documented defaults; contains no location values."}
      - {id: OPS-09, work_package: WP-OPS, kind: artifact, name: .gitattributes + .gitignore, acceptance: ".gitattributes forces eol=lf for *.sh and docker-entrypoint.sh and eol=crlf for *.bat/*.ps1; .gitignore excludes .env."}
      - {id: OPS-10, work_package: WP-OPS, kind: artifact, name: README.md (es), acceptance: "Spanish step-by-step install for Linux and Windows (Docker Desktop + WSL2, NVIDIA driver, .wslconfig memory), start/stop/reset, GPU troubleshooting (ADR-17), hardware guidance (ADR-16), data privacy (only Open-Meteo and OSM egress), limitations disclaimer."}
      - {id: OPS-11, work_package: WP-OPS, kind: artifact, name: scripts/smoke.sh, acceptance: "Against a running stack: sets up a user, creates a project with manual elevation and manual wind (synthetic values), saves one block, runs plan2d at coarse dx, waits for completion and asserts the K field and k.png exist; exits non-zero on any failure."}
