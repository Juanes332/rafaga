  security:
    focus:
      - "OWASP-A01 IDOR: every project-scoped route (projects, alternatives, facade elements, studies, jobs, results, fields, exports, reports, backgrounds, shares) resolves ownership/share in security/ownership; foreign ids return byte-identical 404."
      - "OWASP-A01 role enforcement: reviewer cannot write or launch jobs (403 forbidden) on shared projects; architect-only user management."
      - "OWASP-A07 auth: argon2id, HS256 JWT with exp, JWT_SECRET ≥64 random bytes generated by start script, setup endpoint closed after first user under advisory lock, login rate limit 10/min/address, identical 401 for unknown email and wrong password."
      - "OWASP-A03/A08 uploads: extension + magic-byte sniffing, size limits 100 MB/25 MB enforced while streaming, parsers run with timeouts, files stored under server-generated names, no path from the client ever touches the filesystem (field_name/image_name allow-listed)."
      - "OWASP-A10 SSRF: outbound HTTP only to the configured Open-Meteo and tile hosts; tile z/x/y validated as integers in range; user input never forms a host."
      - "OWASP-A05 config: CORS restricted to ALLOWED_ORIGINS (both localhost and 127.0.0.1 forms of the web port), ports bound to 127.0.0.1, containers non-root uid 10001/node, no secrets in images, logs or build args; .env gitignored."
      - "Privacy NFR-15: no telemetry; outbound payloads limited to rounded coordinates, search text and tile coordinates; verify with an egress allow-list test in api."
      - "Resource exhaustion: estimate/memory guard before allocation, heavy lane single concurrency, job payload size cap 20 MB, alternatives limit, rate limits per ADR-26."
  testing:
    framework: "pytest (api, solver; validation and GPU tests marked slow/gpu), vitest + Testing Library + MSW (web), scripts/smoke.sh (end-to-end against compose)"
    coverage_target: 0.8
    notes: >-
      NFR-18: ≥80 % coverage on api services/{geometry,imports,scene,wind} and solver
      services/{voxelize,postprocess,comfort}. Contract tests: api asserts every scene it
      emits validates against contracts/scene.schema.json and every job payload matches
      contracts/examples/*.json shape; solver consumes the same example payloads as
      fixtures. Web MSW handlers are generated from contracts/openapi.yaml examples.
  documentation:
    sections:
      - "README (es): Requisitos, Instalación en Linux, Instalación en Windows (WSL2), GPU NVIDIA, Uso (start/stop/reset), Puertos y URL, Datos y privacidad, Limitaciones, Solución de problemas"
      - "docs/architecture: plan.yaml, architecture.md, contracts/, adr/"
      - "services/api/README.md: Stack, Endpoints (link to openapi.yaml), Run, Variables, Migrations, Tests"
      - "services/solver/README.md: Physics model (ADR-11..15), Device selection, Job lanes, Validation and benchmarks, Variables"
      - "services/web/README.md: Stack, Runtime config, Design system, Tests"
  deployment:
    images:
      - name: api
        context: services/api
        skill: fastapi-senior
        base: "python:{major}-slim resolved via runtimes.yaml (host 3.12 ≥ floor 3.12 → python:3.12-slim)"
        internal_port: 8000
        healthcheck: /health
        user: "non-root (10001:10001)"
      - name: solver
        context: services/solver
        skill: fastapi-senior
        base: "python:{major}-slim resolved via runtimes.yaml (python:3.12-slim); CUDA via cupy-cuda12x[ctk] wheels, driver from host"
        internal_port: 8000
        healthcheck: /health
        user: "non-root (10001:10001)"
        published: false
        gpu: "optional via compose.gpu.yaml"
      - name: web
        context: services/web
        skill: react-senior
        base: "node:{major}-slim resolved via runtimes.yaml (host Node 24 LTS → node:24-slim)"
        internal_port: 3000
        healthcheck: /
        user: "non-root (node)"
        command: "docker-entrypoint.sh → serve -s dist -l tcp://0.0.0.0:3000"
      - name: db
        context: null
        skill: none-official-image
        base: "postgres:{major}-alpine resolved via runtimes.yaml (floor 16)"
        internal_port: 5432
        healthcheck: "pg_isready -U rafaga"
        user: "postgres (image default, non-root)"
        published: false
    compose: compose.yaml
    compose_overrides: [compose.gpu.yaml]
    volumes: [rafaga-db, rafaga-data]
    env_vars:
      POSTGRES_PASSWORD: "(generated by start script on first run)"
      DATABASE_URL: "(composed in compose.yaml from POSTGRES_PASSWORD: postgresql://rafaga:${POSTGRES_PASSWORD}@db:5432/rafaga)"
      JWT_SECRET: "(generated by start script on first run)"
      JWT_TTL_MINUTES: "720"
      ADMIN_EMAIL: ""
      ADMIN_PASSWORD: ""
      ALLOWED_ORIGINS: "(composed in compose.yaml: http://localhost:${RAFAGA_WEB_PORT},http://127.0.0.1:${RAFAGA_WEB_PORT})"
      TRUST_PROXY: "false"
      RATE_LIMIT_ANON_PER_MINUTE: "120"
      RATE_LIMIT_PER_MINUTE: "600"
      RATE_LIMIT_LOGIN_PER_MINUTE: "10"
      RATE_LIMIT_TILES_PER_MINUTE: "1500"
      DATA_DIR: "/data"
      OPEN_METEO_GEOCODING_URL: "https://geocoding-api.open-meteo.com/v1/search"
      OPEN_METEO_ELEVATION_URL: "https://api.open-meteo.com/v1/elevation"
      OPEN_METEO_ARCHIVE_URL: "https://archive-api.open-meteo.com/v1/archive"
      TILE_URL_TEMPLATE: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
      TILE_USER_AGENT: "Rafaga/1.0 (local desktop app)"
      TILE_CACHE_MAX_MB: "500"
      MAX_UPLOAD_GEOMETRY_MB: "100"
      MAX_UPLOAD_IMAGE_MB: "25"
      ALTERNATIVES_LIMIT_DEFAULT: "8"
      JOB_RETENTION_DAYS: "90"
      RAFAGA_DEVICE: "auto"
      GPU_MEMORY_FRACTION: "0.85"
      CPU_MAX_NODES_3D: "3000000"
      LIGHT_LANE_CONCURRENCY: "2"
      RAFAGA_WEB_PORT: "(empty → kernel-assigned on first start, then persisted by start script)"
      RAFAGA_API_PORT: "(empty → kernel-assigned on first start, then persisted by start script)"
      LOG_LEVEL: "info"
      RAFAGA_IMAGE_REGISTRY: "(empty → build images locally; set → pull ${RAFAGA_IMAGE_REGISTRY}/rafaga-<svc>:${RAFAGA_VERSION}, ADR-29)"
      RAFAGA_VERSION: "(fixed release tag used only with RAFAGA_IMAGE_REGISTRY; never latest)"

