# Ráfaga — architecture plan (Phase 2, software-architect schema).
# Machine-readable. Prose companion: architecture.md. Contracts: contracts/. ADRs: adr/.
# Schema extensions (documented in architecture.md §11): every deliverable row carries
# `work_package`; kind `artifact` is used for non-code deliverables (images, scripts,
# compose, README, shared front-end engines) that the four base kinds cannot express.

project_name: rafaga
shape: services
stack_kind: fullstack

skill_bindings:
  - component: api
    technology: python+fastapi
    skill: fastapi-senior
    path: services/api
  - component: solver
    technology: python+fastapi (health only) + cupy/numpy LBM worker
    skill: fastapi-senior
    path: services/solver
    note: >-
      The FastAPI surface is GET /health only; the rest of the service is a queue worker.
      fastapi-senior governs layout (configs/core/models/routers/services/repositories),
      TDD with pytest, error contract, logging and the container. Numerical kernels live
      under app/services/<domain>/ like any other business logic.
  - component: web
    technology: react+vite+typescript
    skill: react-senior
    also: [frontend-design]
    path: services/web
  - component: db
    technology: postgres (official image, floor 16)
    skill: none-official-image
    note: Official postgres image, no custom build. Schema owned by api (Alembic).
  - component: ops
    technology: docker compose + POSIX sh + PowerShell + cmd wrapper
    skill: engineering-canon
    derived_from: fastapi-senior
    note: >-
      No dedicated skill for distribution scripts. The canon applies: config through the
      environment, secrets never printed or committed, files <=200 lines, functions <=30,
      English comments, internal ports fixed and published ports free (ports.md),
      no nginx, named volumes only.

database: postgres

decisions:
  - id: ADR-01
    decision: "Four runtime services: api, solver, web, db (services shape)."
    why: >-
      The solver needs a CUDA-capable Python image, long-running GPU jobs and crash
      isolation; the api must stay responsive while a 60-minute 3D run holds the GPU.
      The web SPA is static and must be its own image. Postgres is both store and queue.
    rejected: >-
      Modular monolith with an in-process worker (GPU wheels in the api image, one OOM
      kills the API); separate worker-2d/worker-3d (user merged them: one LBM code base);
      OpenFOAM worker (user replaced it with LBM D3Q19).
  - id: ADR-02
    decision: "Postgres is the job queue: jobs table, FOR UPDATE SKIP LOCKED claim, LISTEN/NOTIFY wake-up with 2 s polling fallback."
    why: One component fewer; transactional enqueue with the study row; progress and cancel live in the same row the UI polls.
    rejected: Redis+RQ/Celery (extra service, two sources of truth); RabbitMQ (heavier, no persistence of progress).
  - id: ADR-03
    amended_by: ADR-27  # C-3: the steady mixing-length deviation of the solver is superseded; volume3d is LES again
    decision: "Single LBM code base: D2Q9 (plan, section) and D3Q19 (volume) with regularized BGK collision + Smagorinsky LES, array-module abstraction xp=cupy|numpy, fused CuPy RawKernels on GPU and slab-parallel NumPy on CPU."
    why: >-
      LBM is local, bandwidth-bound and maps directly to GPU; voxel masks handle arbitrary
      geometry; one code path for 2D/3D; CPU fallback is the same algorithm (equivalence
      test <=2 % mean K).
    rejected: >-
      OpenFOAM (CPU-only, multi-GB image); custom finite-volume Navier-Stokes (pressure
      solver hard on GPU); Numba-CUDA/Taichi/Warp (extra toolchains, weaker CPU fallback
      story); pure CuPy ufunc chains (too many kernel launches, < 100 MLUPS 3D).
  - id: ADR-04
    decision: "api owns geometry: import, parametric model, facade generation, validation and grid specification; it emits a canonical scene JSON (contracts/scene.schema.json) and a resolved grid inside each job payload. solver only rasterizes/voxelizes."
    why: >-
      Geometry is needed synchronously by the editor (validation, preview, scene) while
      the solver may be busy for an hour. One owner means 2D and 3D are fed by the same
      model (FR-34) and no geometry code is duplicated.
    rejected: Shared Python package vendored into both images (couples two parallel work packages and their release cadence); solver-owned geometry (api would need a solver round-trip to validate a drawing).
  - id: ADR-05
    decision: "SPA discovers the api through a runtime /config.json written by the web container entrypoint from RAFAGA_API_PORT; host ports are kernel-assigned on first start, then persisted in .env by the start script and bound to 127.0.0.1."
    why: >-
      VITE_* are build-time; a kernel-assigned port is known only after `up`. Persisting
      the first kernel-assigned ports gives users a stable, bookmarkable URL; the SPA builds
      the api URL as location.protocol//location.hostname:apiPort so localhost and 127.0.0.1
      both work; a busy persisted port is cleared and re-assigned by the kernel (US-15).
    rejected: >-
      VITE_API_URL build arg (rebuild on every port change); nginx or any reverse proxy
      (forbidden, extra root process); api serving the SPA (forbidden); hardcoded 3000/8000
      (collide); script scanning for a free port then binding it (TOCTOU race).
  - id: ADR-06
    decision: "Local accounts: argon2id hashes, HS256 JWT bearer (TTL 12 h) kept in sessionStorage; first-run setup endpoint works only while users table is empty (advisory lock); optional ADMIN_EMAIL/ADMIN_PASSWORD insert-if-absent seed; roles architect|reviewer."
    why: FR-01/FR-02/FR-03; no cookies means no CSRF across the two localhost ports; sessionStorage survives reload (US-10 progress recovery).
    rejected: Cookie sessions (cross-port SameSite/CORS credentials complexity); no auth on localhost (violates FR-02); OAuth/OIDC (needs an IdP, offline install).
  - id: ADR-07
    decision: "Job progress by polling GET /api/v1/simulations/{id} every 1 s (TanStack Query refetchInterval) while any job is active."
    why: NFR-06 requires <=2 s; bearer header works on fetch; zero extra infrastructure.
    rejected: SSE (EventSource cannot send Authorization; token-in-URL leaks to logs); WebSocket (extra protocol, auth inside handler, reconnect logic).
  - id: ADR-08
    decision: "Open-Meteo (geocoding, elevation, ERA5 archive) called only by api, cached in Postgres external_cache; ERA5 key = coordinates rounded to 0.1 deg + period, TTL 365 d; elevation key rounded to 4 decimals, TTL 365 d; geocoding TTL 30 d."
    why: FR-12..FR-15, NFR-15 (only rounded coordinates leave the machine), offline reuse, single egress point.
    rejected: Browser calls Open-Meteo directly (no cache sharing, no offline, leaks exact coordinates); station datasets (sparse, often keyed).
  - id: ADR-09
    decision: "Map: MapLibre GL JS with OSM raster tiles fetched through an authenticated api tile proxy with on-disk LRU cache (500 MB, honours upstream Cache-Control, min 7 d), identifying User-Agent, visible attribution; TILE_URL_TEMPLATE configurable."
    why: Q-4 offline re-use of already-viewed areas, OSM tile policy compliance (no bulk prefetch, valid UA, attribution), single egress.
    rejected: Direct browser→OSM (no offline, no UA control); self-hosted vector planet/regional extracts (GBs of download, breaks 15-min install); keyed providers (MapTiler/Mapbox need accounts); bulk prefetch (violates OSM policy).
  - id: ADR-10
    amended_by: ADR-27  # volume3d domain top 5H (blockage < 3 % kept)
    decision: "Q-1 VRAM/RAM-aware estimator and automatic coarsening: bytes/node constants (D2Q9 104 B, D3Q19 224 B) + 512 MiB overhead against a device budget (GPU 0.85*VRAM_total-512 MiB; CPU 0.6*MemAvailable, 3D capped at CPU_MAX_NODES_3D=3e6); proposed dx = dx*(need/budget)^(1/d) rounded up to 0.25 m; reject if smallest building width < 4 cells after coarsening."
    why: FR-40, US-09/US-10 negative scenarios; 25 M nodes*224 B = 5.6 GB fits the 8 GB reference GPU (NFR-02 <=7.2 GB).
    rejected: Shrinking BR-16 domain margins (breaks a product rule); mixed precision fp16 populations (stability risk at high Re); multi-resolution grid refinement (too complex for R1).
  - id: ADR-11
    decision: "Q-2 convergence: time measured in flow-throughs FT = nx/u_lat; spin-up (2D 2 FT, 3D 1.5 FT) then running time-average; every 0.25 FT compare the windowed mean field at analysis height; converged when relative L2 change < 1 % and mean |U| change < 1 % for 3 consecutive checks after the minimum (2D 2 FT, 3D 2 FT); hard cap (2D 8 FT, 3D 6 FT) completes with converged=false and a warning."
    why: A-10; statistically averaged K for unsteady LES/shedding flows; deterministic upper bound for ETA.
    rejected: Residual-based steady criteria (meaningless for unsteady LBM); fixed step count (wastes time or under-averages).
  - id: ADR-12
    amended_by: ADR-27  # volume3d inflow: synthetic turbulence replaces the 2 % perturbation; steady mixing-length deviation superseded
    decision: "Q-3 boundary conditions: inlet = regularized velocity BC with shifted log-law u(z)=(u*/κ)ln((z+z0)/z0) (2D plan: uniform U_ref(z_a)), 3D seeded 2 % random perturbation; outlet = constant-density (ρ=1) regularized pressure BC + sponge (last 10 % of domain, τ ramp to 1.0); top and lateral = free-slip specular; ground = halfway bounce-back + log-law wall-function drag force (Guo) in first fluid layer; buildings = halfway bounce-back."
    why: Keeps the ABL profile horizontally homogeneous with unresolved z0 (z0 up to 2 m at dx 1-2 m), absorbs outflow reflections, standard for LBM urban LES.
    rejected: Zou-He inlet (unstable at low τ); periodic streamwise (needs precursor); no-slip top (spurious shear); resolving roughness elements (unaffordable).
  - id: ADR-13
    decision: "Q-3 porosity: Forchheimer body force via Guo forcing, semi-implicit velocity update. Screens: Idelchik thin perforated plate ζ(β)=((0.707*sqrt(1-β)+1-β)/β)^2 spread over the layer thickness Δn (>=1 cell), F=-ρ ζ/(2Δn)|u_n|u_n on the normal component; vegetation: F=-ρ C_d LAD |u| u with C_d=0.2 (setting); sub-grid thin solids (coverage < 0.5 of a cell from 4x supersampling) become porous cells with β=1-coverage."
    why: FR-29/FR-33, BR-10 (β 0.05-0.95 → ζ 1075..0.05); fins and screens thinner than dx stay physically represented instead of vanishing or becoming walls.
    rejected: Partial bounce-back (Walsh) (calibration less transparent, tied to τ); Darcy linear term (viscous regime irrelevant at Re~1e6); ignoring sub-grid elements.
  - id: ADR-14
    decision: "LBM unit conversion: inlet reference velocity u_lat=0.05 at the top of the inlet profile (Ma=0.087<=0.1); dt=u_lat*dx/U_phys; molecular ν_lat=max(ν_phys*dt/dx^2, 5e-5); τ0=0.5+3ν_lat; Smagorinsky C_s=0.17 (Hou et al. local Π^neq form); τ_eff clamped to [0.5005, 2.0]; abort with numerical_instability if local Ma>0.35 or NaN."
    why: Reynolds-number independence of sharp-edged bluff-body flows (Re_H>2e4) justifies an effective lattice Re; regularized collision + LES keeps τ near 0.5 stable.
    rejected: Matching physical Re (τ→0.5, unstable); u_lat 0.1 (Ma 0.17 at inlet, 0.35 at corners); MRT collision (more memory/ops, regularized BGK is enough with LES).
  - id: ADR-15
    decision: "Q-5 Lawson LDDC defaults: comfort classes by 5 % exceedance — sitting 4 m/s, standing 6 m/s, strolling 8 m/s, business walking 10 m/s, uncomfortable >10 m/s; safety by 0.025 % exceedance — 15 m/s (frail/cyclists) and 20 m/s (general public). Effective speed max(mean, GEM), GEM=U(1+3I)/1.85; exceedance from per-sector Weibull fits of ERA5 U10 transferred to site roughness through a 60 m blending height (z0_ref=0.03 m); renormalised over simulated sectors and flagged partial when coverage < 95 %."
    why: BR-05/BR-12/FR-44; table editable in settings; Weibull keeps the computation closed-form per cell.
    rejected: Davenport or NEN 8100 as default (user asked LDDC); empirical histogram per sector (noisy tails at 0.025 %).
  - id: ADR-16
    decision: "Q-6 CPU limits: minimum 4 cores/8 GB RAM (2D only), recommended 16 cores/32 GB for 3D on CPU; CPU 3D capped at CPU_MAX_NODES_3D=3e6 and auto-coarsened to it; hosts with <16 GB RAM get a 1.5e6 cap and a 2D-first recommendation; Docker Desktop memory (.wslconfig) documented."
    why: NFR-03 (<=3 M nodes in <=90 min on 16 cores), Docker Desktop defaults to 50 % of host RAM.
    rejected: No cap (multi-hour silent runs); refusing 3D on CPU entirely (FR-38 requires fallback).
  - id: ADR-17
    amended_by: ADR-29  # cupy-cuda12x + runtime/nvrtc wheels instead of [ctk]
    decision: "Q-7 GPU verification: start scripts run `nvidia-smi -L`; if it succeeds they build and run `docker compose -f compose.yaml -f compose.gpu.yaml run --rm --no-deps solver python -m app.services.device.device_probe` which allocates and runs a CuPy RawKernel; exit 0 → keep compose.gpu.yaml, else warn and start CPU-only. CuPy comes from cupy-cuda12x[ctk] wheels on python:3.12-slim (no CUDA base image); driver from host (NVIDIA Container Toolkit / WSL2)."
    why: Same check on Linux and Windows; catches driver/toolkit/WSL kernel mismatches before the user launches a job (FR-06, US-15).
    rejected: Trusting nvidia-smi alone (host OK but container runtime missing is common on Windows); nvidia/cuda base images (+3 GB, not resolvable through runtimes.yaml).
  - id: ADR-18
    decision: "One named volume rafaga-data mounted at /data in api and solver (both uid/gid 10001), plus rafaga-db for Postgres. Fields stored as raw little-endian float32 files + an .npz bundle; metadata in Postgres."
    why: NFR-12 named volumes only; zero-copy streaming of fields to the browser; npz/CSV exports (NFR-22).
    rejected: Fields as Postgres bytea (bloat, vacuum); object store (MinIO) (extra service); bind mounts (Windows path issues).
  - id: ADR-19
    decision: "solver owns every numeric artefact (K, zones previews, Lawson aggregate, export PNG at >=300 dpi, PDF report via WeasyPrint) on a light lane; api computes zone areas with numpy from stored K fields; the browser re-thresholds zones client-side."
    why: One owner of colormaps and plotting code (matplotlib+cmocean); NFR-05 (<=2 s re-zoning) without queueing behind a 3D run; light lane runs concurrently with the heavy lane.
    rejected: api renders PNG/PDF (duplicate cmocean code in two images); browser-generated PDF (no 300 dpi, inconsistent typography).
  - id: ADR-20
    decision: "Shifted log-law U(z)=(u*/κ)ln((z+z0)/z0), κ=0.41, u*=κU10/ln((10+z0)/z0) replaces the literal BR-07 form."
    why: BR-08 allows z0=2.0 m > z_a=1.5 m where ln(z/z0) is negative; the shifted form equals BR-07 for z>>z0.
    rejected: Displacement height d (extra parameter users cannot estimate); clamping z to z0 (discontinuous K).
  - id: ADR-21
    decision: "Front-end: react-senior stack + frontend-design system (contracts/design-system.md); MapLibre GL for location, SVG metric editor, react-three-fiber for 3D, custom WebGL2 particle advection as the memorable element, cmocean LUTs, self-hosted Hanken Grotesk + Literata via @fontsource, i18next es-CO."
    why: FR-45/FR-49/FR-52/NFR-07; self-hosted fonts keep NFR-15 egress limited to Open-Meteo and OSM.
    rejected: Google Fonts CDN (extra egress); deck.gl (heavy for one particle layer); Leaflet (no WebGL layer for particles over map); MUI/Uko (not requested).
  - id: ADR-22
    decision: "Solver process model: uvicorn serves /health; a supervisor runs a heavy lane (1 job at a time, executed in a spawned child process) and a light lane (LIGHT_LANE_CONCURRENCY=2 threads, CPU only); cancel is cooperative (checked every <=1 s) with hard kill at 8 s."
    why: US-09 cancel <=10 s, GPU memory always released, a crashing kernel cannot kill /health or the light lane.
    rejected: Threads only (cannot force-free GPU memory, cancel unreliable); one process per job type service (more images).
  - id: ADR-23
    decision: "Comparability (BR-11): api derives a project-level output grid from base-building bounds (+2 H_max margin, + max facade outward extent) so every alternative/direction of the same kind and dx lands on identical cells; each result stores comparability_key=sha256(kind, direction, z0, U_ref, dx, output grid, analysis height, section line)."
    why: ΔK per cell without resampling; incompatibility is a key mismatch with an itemised diff.
    rejected: Resample on compare (interpolation error masquerading as ΔK).
  - id: ADR-24
    decision: "Importers: ezdxf (closed LWPOLYLINE/POLYLINE; height from layer-name number, XDATA/attribute 'height', or missing_height), trimesh for STL/OBJ (per connected body, horizontal slicing every 3 m → stacked tiers), ifcopenshell (R2, IfcBuilding*/IfcBuildingElement axis-aligned bounding boxes); everything becomes buildings with footprint + tiers."
    why: Facades attach to footprint edges; tiers preserve massing; uniform scene primitives (prisms).
    rejected: Passing raw meshes to the solver (facade attachment impossible, voxelizer must handle non-watertight meshes).
  - id: ADR-25
    amended_by: ADR-29  # optional registry pull via RAFAGA_IMAGE_REGISTRY
    decision: "Distribution: root start/stop/reset entry points (.sh, .ps1, .bat) delegating to scripts/rafaga.sh and scripts/rafaga.ps1; compose project name 'rafaga'; secrets generated on first run into .env (never printed); ports bound to 127.0.0.1; reset requires typing 'borrar'."
    why: FR-06..FR-08, NFR-09..NFR-12, OOS-6 (local only).
    rejected: Native installers (per-OS packaging); registry images (OOS-9, optional later); binding 0.0.0.0 (exposes the app to the LAN).
  - id: ADR-26
    decision: "Rate limits (two tiers per canon): RATE_LIMIT_ANON_PER_MINUTE=120 by address, RATE_LIMIT_PER_MINUTE=600 by principal, RATE_LIMIT_LOGIN_PER_MINUTE=10 on /auth/login and /auth/setup, tiles budget RATE_LIMIT_TILES_PER_MINUTE=1500 by principal; in-memory store (single replica)."
    why: The SPA polls at 1 Hz and MapLibre bursts dozens of tile requests per pan; login is the brute-force surface.
    rejected: Skill defaults 120/60 (1 Hz polling alone exhausts 60/min); shared Redis store (single replica).

  - id: ADR-27
    decision: "volume3d turbulence (BL-01/BL-02): Smagorinsky LES (C_s 0.17, Hou et al.) with length scale min(C_s dx, kappa d_wall) as the only eddy viscosity; the steady Prandtl mixing length kappa(z+z0) is removed from the volume3d interior; ACCEPTED DEVIATION (user decision, ADR-27 amendment): hybrid closure = first 6 wall layers at 0.8 kappa min(z+z0,d_wall) plus PI far-field profile nudging (section2d/plan2d keep theirs); synthetic inflow turbulence by the Xie & Castro (2008) forward-stepwise digital filter (L_y=L_z~H, L_x~2H, target I_u(z)=1/ln((z+z0)/z0) clipped to 0.15-0.30, I_v=0.75 I_u, I_w=0.5 I_u) replaces the 2 % seeded perturbation; wall-law drag on the first layer and top shear force u*^2 are kept; resolved ti=sigma_u/U_mean at z_a feeds Lawson GEM; volume3d domain top 5H instead of 6H (blockage < 3 % still enforced, top raised if needed)."
    why: >-
      The steady mixing-length deviation kept the mean profile (K 1.00-1.05) but made 3D
      effectively URANS: resolved ti ~ 0 and the Lawson gust factor fell to G=1, so 3D
      lost the resolved gusts that justify it (C-3, FR-37, ADR-15). The digital filter only
      costs two inlet planes of memory; 5H saves ~17 % of nodes so typical cases fit the
      8 GB budget of ADR-10 despite longer LES averaging. Explicit amendment of BR-16 (6H)
      for volume3d only.
    rejected: >-
      Keeping the steady mixing length (no gusts); periodic precursor domain (2x memory and
      time, does not fit 8 GB at 25 M nodes); resolved Irwin spires/roughness upstream
      (several extra H of fetch at fine dx); SEM / random Fourier inflow (costlier per step,
      more parameters); WALE/Vreman SGS (the issue was the added mixing length, not
      Smagorinsky; revisit if SOL-16 demands); URANS k-epsilon (not LBM-native, no gusts).
  - id: ADR-28
    decision: "Device capability flows solver -> db -> api -> web (BL-06): the solver probes its device and runs a short micro-benchmark at start-up, upserts solver_nodes (device, gpu_name, vram, ram budget, cores, mlups_2d, mlups_3d) and heartbeats every 5 s; the api reads the freshest row (offline after 30 s) and exposes it only through the authenticated GET /api/v1/system/status (API-09) and the estimate (API-46: effective device + eta_seconds from mlups_3d); the web shows the device badge and, for volume3d with an effective cpu device, a modal with ETA, node count and the NFR-03 limit that requires explicit confirmation before POST /simulations."
    why: NFR-03 requires an estimate before a CPU 3D run; the SPA must never talk to the unpublished, user-auth-less solver (ADR-01); every value already exists in solver_nodes, so no table or endpoint is added.
    rejected: SPA querying the solver (breaks ADR-01); a new /system/capabilities endpoint (duplicates API-09); a mandatory confirm_cpu_3d flag on POST /simulations (contract churn, UX risk not security risk; ADR-16 hard limits still apply); always blocking 3D on CPU (NFR-03 allows a reduced case).
  - id: ADR-29
    decision: "Solver image slimmed to <=3 GB (BL-05): multi-stage python:3.12-slim with cupy-cuda12x + nvidia-cuda-runtime-cu12 + nvidia-cuda-nvrtc-cu12 pinned together instead of cupy-cuda12x[ctk], no compilers/headers/caches/tests in the final stage; optional registry pull: RAFAGA_IMAGE_REGISTRY empty (default) builds locally as before, set -> compose uses ${RAFAGA_IMAGE_REGISTRY}/rafaga-<svc>:${RAFAGA_VERSION} and start scripts pull, falling back to a local build on failure; tags are fixed versions, never latest; no registry credentials in the repo."
    why: The solver only uses RawKernel, elementwise and reductions (runtime + NVRTC); [ctk] adds ~2.5 GB of cuBLAS/cuFFT/cuSOLVER/cuSPARSE/cuRAND/NPP it never loads; 5.5 GB slows the first start on laptops; slow machines benefit from a prebuilt image.
    rejected: nvidia/cuda runtime base (~3 GB base alone, rejected in ADR-17); keeping [ctk]; separate CPU and GPU images (more compose/script complexity); mandatory registry (breaks offline use and local build of ADR-25).

contracts:
  developer:
    spec: >-
      Ráfaga is a local, location-agnostic web app for pedestrian-level (default 1.5 m,
      0.5-3.0 m) urban wind screening. Repo root /home/juanhez/Documents/juanhez/projects/rafaga:
      services/api (fastapi-senior), services/solver (fastapi-senior, /health only),
      services/web (react-senior + frontend-design), scripts/ + root start/stop/reset
      wrappers + compose.yaml + compose.gpu.yaml (WP-OPS), docs/. NO preset location, sample
      project, coordinates, elevation, density or wind data anywhere in code, migrations,
      seeds or defaults (BR-18); test fixtures use synthetic coordinates and recorded
      HTTP responses.

      API (base /api/v1, contract contracts/openapi.yaml, the source of truth for paths and
      schemas). Auth: argon2id + HS256 JWT bearer (JWT_SECRET, JWT_TTL_MINUTES=720).
      PUBLIC_PATHS = /health, /api/v1/auth/setup-status, /api/v1/auth/setup,
      /api/v1/auth/login. Setup only while zero users (pg_advisory_xact_lock), else 409
      setup_already_done. Optional ADMIN_EMAIL/ADMIN_PASSWORD seed is insert-if-absent.
      Roles: architect (read/write, can create users and share projects) and reviewer
      (read-only on projects shared with them; any write or job launch → 403 forbidden).
      Ownership: a project the caller neither owns nor has a share on → 404 with a
      byte-identical body to a missing id (code project_not_found); same for every child
      resource (alternatives, elements, studies, jobs, results, exports, reports,
      backgrounds). Error body {code, message, details?, hint?}; messages Spanish-ready
      codes, English messages, the SPA maps codes to es-CO copy.

      Data model (Postgres, Alembic migrations owned by api; tables listed as ENT rows; the
      job tables jobs, studies, results, comfort_results, exports, reports, solver_nodes,
      schema_meta are a shared contract with the solver defined column-by-column in
      contracts/job-contract.md). Project: name, lat/lon nullable until the user places
      it, elevation_m + elevation_source (open_meteo|manual), air_density_kg_m3 computed
      by ISA ρ=1.225(1-2.25577e-5 h)^4.25588 (BR-06), analysis_height_m (default 1.5).
      Wind climate per project: source era5|manual, rose (16 sectors centred on
      0,22.5..337.5 deg, meteorological 'from' convention; per sector frequency, mean,
      p50, p90, max, weibull_k, weibull_c; calm fraction < 0.5 m/s), period_years
      (default 10), manual_direction_deg + manual_u10_ms, terrain_category + z0_m
      (BR-08: open_sea 0.0002, open 0.03, suburban 0.3, urban 1.0 default, dense_urban
      2.0). Geometry per project (= base case): versioned list of buildings {id, name,
      footprint (local ENU metres, CCW, no repeated closing vertex), holes, height_m
      (1-500), tiers?, source, missing_height}; editor saves the whole set with
      expected_version (409 version_conflict); when non-base alternatives exist a change
      needs confirm_base_change=true (409 base_locked otherwise, BR-09). Alternatives: one
      base per project (is_base, undeletable) + up to ALTERNATIVES_LIMIT_DEFAULT=8
      (user setting) derived ones (409 alternatives_limit). Facade elements: {building_id,
      edge_index, type screen|fins|canopy|setback|vegetation, params} with ranges and
      defaults served by GET /api/v1/facade-strategies (min-max, default: screen porosity
      0.05-0.95 0.40, height_m 0.5-50 3.0 clamped to building height, offset_m 0-5 0.5,
      fixed thickness 0.1; fins depth_m 0.1-3.0 0.5, pitch_m 0.3-10 1.0, thickness_m
      0.05-0.5 0.15, height_m 1-500 null=building height; canopy overhang_m 0.5-6.0 2.0,
      height_m 2.5-10 3.5, fixed thickness 0.3; setback setback_m 0.1-5.0 1.0,
      floor_height_m 2.5-6.0 3.0, start_floor 1-100 1; vegetation lad_m2_m3 0.1-5.0 1.0,
      height_m 1-30 8.0, width_m 0.5-5.0 3.0, offset_m 0-5.0 1.0; maximum outward reach
      10 m = FACADE_ENVELOPE_M). Out-of-range values are clamped and reported in
      `adjustments` (US-08). The api compiles alternative → canonical scene
      (contracts/scene.schema.json) and resolves the simulation grid (BR-16 margins 5H
      upstream, 15H downstream, 5H lateral, 6H top (5H in volume3d, ADR-27), blockage < 3 % in 3D) plus the
      project-level output grid (ADR-23), snapshots both into each job payload.

      Simulations: POST /simulations creates a study (alternative, kind plan2d|section2d|
      volume3d, directions ≤16 or a section line, dx_m, device auto|cpu|gpu,
      auto_coarsen) and one job per direction on the heavy lane in a single transaction,
      then NOTIFY rafaga_jobs. Estimate uses solver_nodes capabilities (ADR-10). Studies
      with an ERA5 rose carry an aggregate_template; the solver enqueues the aggregate
      job (Lawson, ADR-15) when the study's last job finishes. Results expose metadata, raw float32 fields
      (K, ux, uy, uz, speed, mask, ti), preview PNGs, 3D viewer manifest, npz/csv
      downloads; zone areas (BR-02..BR-04, thresholds as query params) are computed by
      api with numpy. Comparisons are stateless: check (BR-11 via comparability_key,
      422 results_incomparable with differences[]), areas, comfort. Exports (PNG ≥300 dpi
      with legend, scale bar, north arrow, reference wind, disclaimer) and PDF reports
      (A4, project data, location, rose, parameters, maps, area table, Lawson, FR-48
      disclaimer) are light-lane jobs rendered by the solver. External data (ADR-08,
      ADR-09) only through the api. Settings per user: k_accel 1.2, k_stagnation 0.3,
      dk_reduction -0.1, Lawson table, turbulence_intensity_default 0.25 (2D GEM),
      vegetation_cd 0.2, alternatives_limit 8. Templates (R3) never contain location.

      Solver: claims jobs (contracts/job-contract.md), selects device (RAFAGA_DEVICE
      auto|cpu|gpu, per-job override), voxelizes the scene, runs D2Q9/D3Q19 per
      ADR-12..ADR-14 with convergence per ADR-11, writes fields/PNGs/manifest under
      /data/results/{project_id}/{study_id}/{job_id}/ and inserts the results row in the
      same transaction that marks the job completed; publishes progress/phase/eta every
      ~1 s, heartbeat in solver_nodes every 5 s, honours cancel_requested within 10 s,
      marks orphaned running jobs failed+resumable on start. Validation suite (FR-41):
      square cylinder St 0.13-0.15, AIJ case A recirculation, CPU/GPU ΔK̄ ≤2 %.

      Web: SPA with step rail Proyecto → Geometría → Viento → Alternativas → Simular →
      Comparar, central canvas, right inspector, full-screen compare with keyboard swipe
      slider, animated particle flow on plan results (static under
      prefers-reduced-motion), cmocean speed (K) and balance (ΔK) with numeric legends,
      zones distinguishable without colour (hatch patterns + labels), WCAG 2.2 AA,
      es-CO copy externalised (i18next), light/dark themes. API base URL from runtime
      /config.json (ADR-05); bearer token in sessionStorage; binary fields fetched with
      the bearer and drawn client-side; images fetched as blobs (no token in URLs).

      Ops: compose project 'rafaga'; ports 127.0.0.1:${RAFAGA_WEB_PORT:-0}:3000 and
      127.0.0.1:${RAFAGA_API_PORT:-0}:8000, solver and db unpublished; start scripts
      implement ADR-05/ADR-17/ADR-25; README in Spanish.
    deliverables:
      # ---------------- WP-API (fastapi-senior) — services/api ----------------
      - {id: ENT-01, work_package: WP-API, kind: entity, name: users, acceptance: "Alembic migration creates users(id uuid, email citext unique, password_hash argon2id, role architect|reviewer, created_at) and a test proves the hash never appears in any response model."}
      - {id: ENT-02, work_package: WP-API, kind: entity, name: projects, acceptance: "projects(id, owner_id, name, lat, lon, elevation_m, elevation_source, air_density_kg_m3, analysis_height_m default 1.5, created_at, updated_at) with lat/lon/elevation/density nullable and no column default holding a location value."}
      - {id: ENT-03, work_package: WP-API, kind: entity, name: project_shares, acceptance: "project_shares(project_id, user_id, created_at) PK(project_id,user_id), cascade on project delete; reviewer read access is resolved through this table in the ownership guard."}
      - {id: ENT-04, work_package: WP-API, kind: entity, name: geometries, acceptance: "geometries(project_id PK, version int, buildings jsonb validated against the Building schema of openapi.yaml, updated_at); PUT with a stale expected_version returns 409 version_conflict."}
      - {id: ENT-05, work_package: WP-API, kind: entity, name: uploads, acceptance: "uploads(id, project_id, kind geometry|background, filename, path under /data/uploads, size_bytes, sha256, created_at); files over 100 MB (geometry) or 25 MB (image/PDF) are rejected with 413 upload_too_large before being persisted."}
      - {id: ENT-06, work_package: WP-API, kind: entity, name: background_plans, acceptance: "background_plans(id, project_id, upload_id, page_count, page, calibration jsonb {p1,p2,distance_m}, transform jsonb {offset,rotation_deg,scale}, opacity) persists across restarts and is deleted with its project."}
      - {id: ENT-07, work_package: WP-API, kind: entity, name: wind_climates, acceptance: "wind_climates(project_id PK, source era5|manual, period_years default 10, rose jsonb, cache_key, manual_direction_deg, manual_u10_ms, terrain_category default urban, z0_m default 1.0, updated_at); a new project has a row with rose null and no direction/speed."}
      - {id: ENT-08, work_package: WP-API, kind: entity, name: external_cache, acceptance: "external_cache(kind geocode|elevation|era5, key, payload jsonb, fetched_at, expires_at) PK(kind,key); a second identical ERA5 request within TTL performs zero outbound HTTP calls (asserted with a fake transport)."}
      - {id: ENT-09, work_package: WP-API, kind: entity, name: alternatives, acceptance: "alternatives(id, project_id, name, is_base, position, created_at) with a partial unique index guaranteeing exactly one is_base row per project, created together with the project."}
      - {id: ENT-10, work_package: WP-API, kind: entity, name: facade_elements, acceptance: "facade_elements(id, alternative_id, building_id, edge_index, type, params jsonb, created_at) where params always validates against the per-type schema in openapi.yaml after clamping."}
      - {id: ENT-11, work_package: WP-API, kind: entity, name: studies, acceptance: "studies table exactly as in contracts/job-contract.md §2.1 with status derived from its jobs (queued|running|completed|partial|failed|cancelled)."}
      - {id: ENT-12, work_package: WP-API, kind: entity, name: jobs, acceptance: "jobs table, indexes and NOTIFY trigger exactly as in contracts/job-contract.md §2.2, including the partial index on (lane, priority desc, created_at) where status='queued'."}
      - {id: ENT-13, work_package: WP-API, kind: entity, name: results, acceptance: "results table exactly as in contracts/job-contract.md §2.3 with unique(job_id) and comparability_key indexed."}
      - {id: ENT-14, work_package: WP-API, kind: entity, name: comfort_results, acceptance: "comfort_results table exactly as in contracts/job-contract.md §2.4 keyed by (study_id, lawson_hash)."}
      - {id: ENT-15, work_package: WP-API, kind: entity, name: exports, acceptance: "exports table exactly as in contracts/job-contract.md §2.5 linking an owner, a job and the produced PNG path."}
      - {id: ENT-16, work_package: WP-API, kind: entity, name: reports, acceptance: "reports table exactly as in contracts/job-contract.md §2.5 with version incremented per project and file path of the PDF."}
      - {id: ENT-17, work_package: WP-API, kind: entity, name: user_settings, acceptance: "user_settings(user_id PK, thresholds jsonb, lawson jsonb, turbulence_intensity_default, vegetation_cd, alternatives_limit) lazily created with the documented defaults on first GET /api/v1/settings."}
      - {id: ENT-18, work_package: WP-API, kind: entity, name: templates, acceptance: "templates(id, owner_id, name, payload jsonb) where a JSON-schema check rejects any payload key named lat, lon, latitude, longitude, elevation or location with 422."}
      - {id: ENT-19, work_package: WP-API, kind: entity, name: solver_nodes, acceptance: "solver_nodes table exactly as in contracts/job-contract.md §2.6; GET /api/v1/system/status reports solver offline when heartbeat_at is older than 30 s."}
      - {id: ENT-20, work_package: WP-API, kind: entity, name: schema_meta, acceptance: "schema_meta(key PK, value) contains job_contract_version='1' after `alembic upgrade head`, which the api runs at startup before /health turns healthy."}
      - {id: API-01, work_package: WP-API, kind: endpoint, name: GET /health, acceptance: "Unauthenticated 200 {status:'ok', db:'ok', version} or 503 {status:'degraded', db:'down'} when Postgres is unreachable; exempt from both rate-limit tiers."}
      - {id: API-02, work_package: WP-API, kind: endpoint, name: GET /api/v1/auth/setup-status, acceptance: "Public; returns {needs_setup:true} when the users table is empty and {needs_setup:false} otherwise."}
      - {id: API-03, work_package: WP-API, kind: endpoint, name: POST /api/v1/auth/setup, acceptance: "Public; with zero users creates an architect from {email,password>=10 chars} and returns 201 {access_token, token_type:'bearer', expires_in, user}; returns 409 setup_already_done once any user exists and 422 password_too_short for <10 chars."}
      - {id: API-04, work_package: WP-API, kind: endpoint, name: POST /api/v1/auth/login, acceptance: "Public; valid credentials return 200 with a JWT whose sub is the user id and role claim; wrong email or password return the same 401 invalid_credentials body; 11th attempt within a minute from one address returns 429 with Retry-After."}
      - {id: API-05, work_package: WP-API, kind: endpoint, name: GET /api/v1/auth/me, acceptance: "Returns {id, email, role} of the bearer; 401 without or with an expired token."}
      - {id: API-06, work_package: WP-API, kind: endpoint, name: GET /api/v1/users, acceptance: "Architect only; lists local users {id,email,role,created_at}; reviewer gets 403 forbidden."}
      - {id: API-07, work_package: WP-API, kind: endpoint, name: POST /api/v1/users, acceptance: "Architect creates {email,password,role}; 201 with the user; 409 email_taken on duplicate email."}
      - {id: API-08, work_package: WP-API, kind: endpoint, name: "DELETE /api/v1/users/{user_id}", acceptance: "Architect deletes another user (204) and their shares; deleting oneself returns 409 cannot_delete_self."}
      - {id: API-09, work_package: WP-API, kind: endpoint, name: GET /api/v1/system/status, acceptance: "Returns api/db health plus solver {online, device cpu|gpu, gpu_name, vram_total_bytes, ram_budget_bytes, cpu_cores, mlups_2d, mlups_3d, heartbeat_at} from the freshest solver_nodes row."}
      - {id: API-10, work_package: WP-API, kind: endpoint, name: GET /api/v1/projects, acceptance: "Lists projects owned by or shared with the caller (newest first) with {id,name,has_location,updated_at,role_on_project}; another user's unshared project never appears."}
      - {id: API-11, work_package: WP-API, kind: endpoint, name: POST /api/v1/projects, acceptance: "Architect creates {name}; 201 with lat/lon/elevation/density null, a base alternative, empty geometry v1 and a wind_climates row with z0 1.0 and no rose."}
      - {id: API-12, work_package: WP-API, kind: endpoint, name: "GET /api/v1/projects/{project_id}", acceptance: "Returns the full Project schema; a foreign id and a random id return byte-identical 404 project_not_found bodies (test compares bytes)."}
      - {id: API-13, work_package: WP-API, kind: endpoint, name: "PATCH /api/v1/projects/{project_id}", acceptance: "Owner renames or sets analysis_height_m (0.5-3.0, else 422); reviewer with share gets 403 forbidden."}
      - {id: API-14, work_package: WP-API, kind: endpoint, name: "DELETE /api/v1/projects/{project_id}", acceptance: "Owner deletes project rows (cascade), cancels its active jobs and removes /data/results/{project_id} and /data/uploads/{project_id}; returns 204."}
      - {id: API-15, work_package: WP-API, kind: endpoint, name: "POST /api/v1/projects/{project_id}/duplicate", acceptance: "Creates 'Copia de <name>' with location, wind, geometry, alternatives and facade elements copied (no jobs/results); returns 201 with the new project."}
      - {id: API-16, work_package: WP-API, kind: endpoint, name: "PUT /api/v1/projects/{project_id}/location", acceptance: "Accepts {lat,lon (5 decimals kept), elevation_m?}; without elevation_m fetches Open-Meteo elevation, computes ISA density and returns both; lat outside ±90 or lon outside ±180 → 422 coordinates_out_of_range; elevation upstream failure → 503 elevation_unavailable with hint to enter it manually."}
